<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title id="ui-title">Loading...</title>
<link rel="icon" id="ui-favicon" type="image/webp" href="">

<style>
/* =============================================================
[DESIGN SYSTEM TOKENS - v1.2.0] [LOCK]
=============================================================
*/
:root {
--bg-panel: #fff;
--text: #000;
--skeleton-bg: #f0f0f0;
--nav-active-color: #ffffff; /* 全时差值核心色 */
--nav-h: 32px;
--grid-gap: 4px;
--f-fallback: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
--nav-weight: 700;
--nav-font-size: 18px;
--ease: cubic-bezier(0.23, 1, 0.32, 1);
--transition-slow: 0.6s var(--ease);
--transition-fast: 0.3s ease;
--icon-stroke: 1.5px;
}

/* [V1.2.9] 针对 350px 以下设备的工业级等比例缩放 */
@media (max-width: 350px) {
    :root { 
        --nav-font-size: 14px; 
        --nav-h: 28px; /* 降低基准高度，保持比例平衡 */
    }

    /* 图标同步缩小，防止在窄屏下抢夺视觉重心 */
    .plus-icon {
        width: 20px; 
        height: 14px;
    }
    .plus-icon::before { width: 12px; }
    .plus-icon::after { height: 12px; transform: translateX(-5px) translateY(-50%); }

    /* 汉堡包按钮同步缩小 */
    .menu-btn { width: 20px; }
    .menu-btn span { width: 20px; }

    .mobile-main-link { padding: 10px 0; }
}

@media (prefers-color-scheme: dark) { :root { --bg-panel: #000; --text: #fff; --skeleton-bg: #1a1a1a; } }
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-touch-callout: none; scrollbar-width: none; }
::-webkit-scrollbar { display: none; width: 0 !important; height: 0 !important; }

body {
font-family: var(--f-fallback); color: var(--text); background: var(--bg-panel);
min-height: 100vh; min-height: 100dvh; overflow-x: hidden; -webkit-font-smoothing: antialiased;
}

/* v1.2.0 工业级滚动死锁样式 */
body.menu-open {
position: fixed;
width: 100%;
overflow: hidden;
--nav-active-color: #ffffff; /* 锁定白色，靠差值渲染 */
}

/* =============================================================
[MOD] 3. 兼容性与高度降级
=============================================================
*/
.left-panel, .right-panel, .overlay-bg, .overlay-content { 
    height: 100vh; /* 兜底 */
    height: 100dvh; 
}

/* [FIX] 混合模式失效降级：汉堡包图标黑色补丁 */
@supports not (mix-blend-mode: difference) {
    .nav-wrapper, .overlay-content { mix-blend-mode: normal !important; background: rgba(255,255,255,0.9); }
    .nav a, .menu-btn span, .mobile-main-link, .mobile-sub-links a { 
        color: #000 !important; 
    }
    .menu-btn span, .plus-icon::before, .plus-icon::after {
        background-color: #000 !important;
    }
}

/* =============================================================
[SECTION: HEAD] [LOCK]
=============================================================
*/
.nav-wrapper {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10000; 
    mix-blend-mode: difference; /* 保持差值 */
    pointer-events: none;
    transition: none; 
}

.nav { padding: var(--grid-gap) var(--grid-gap) 0 var(--grid-gap); display: flex; justify-content: space-between; align-items: center; }
.nav-logo-zone, .nav-links-zone { pointer-events: auto; display: flex; align-items: center; height: var(--nav-h); }
.nav a, .sub-nav-bar a, .mobile-link-group a {
color: var(--nav-active-color) !important;
text-decoration: none; font-weight: var(--nav-weight);
font-size: var(--nav-font-size); display: flex; align-items: center; white-space: nowrap;
-webkit-tap-highlight-color: transparent;
transition: transform 0.1s var(--ease); 
}

/* [MOD] 4. 触感回馈：全局激活态 */
.nav-logo-zone a:active, 
.nav-links-zone a:active, 
.menu-btn:active, 
.mobile-main-link:active, 
.mobile-sub-links a:active, 
.plus-icon:active { 
    transform: scale(0.95); 
    transition: transform 0.1s var(--ease); 
}

/* =============================================================
🛠️ v1.2.7 终极逻辑修复：从“硬编码”回归“自适应通栏”
=============================================================
*/
@media (min-width: 768px) {
    /* [LOCK] 物理隔离 */
    .menu-btn, .overlay-bg, .overlay-content, .indicators { display: none !important; }

    /* [LAYOUT] 导航布局独立化 */
    .nav-links-pc { display: flex !important; gap: 30px; height: var(--nav-h); align-items: center; }
    .has-sub { position: relative; height: 100%; display: flex; align-items: center; }

    /* [CORE] 通栏色块逻辑：不再使用 fixed top 计算，改用溢出 absolute */
    .nav a:hover::before, 
    .sub-nav-bar a:hover::before,
    .nav-logo-zone a:hover::before { 
        content: ''; 
        position: absolute; 
        top: 50%;
        /* 核心：利用 200vw 配合 left:-100vw 实现“伪 fixed”的全屏横跨效果 */
        left: -100vw; 
        width: 300vw; 
        height: 1.2em; 
        background: #fff; 
        z-index: -1; 
        pointer-events: none;
        transform: translateY(-50%);
    }

    /* 针对 Logo 的特殊处理（如果它的容器有限制） */
    .nav-logo-zone { position: relative; }

    /* [FIX] 子菜单：确保容器本身不切断溢出的背景条 */
    .sub-nav-bar { 
        display: flex !important; 
        flex-direction: column;
        position: absolute; 
        top: 100%; 
        left: 0;
        opacity: 0; 
        visibility: hidden; 
        padding-top: 4px;
        transition: 0.3s var(--ease);
        pointer-events: auto;
        /* 关键：允许背景条向左右无限延伸 */
        overflow: visible !important; 
    }
    .has-sub:hover .sub-nav-bar { opacity: 1; visibility: visible; }

    /* [ANIMATION] 子菜单项：阶梯入场逻辑保持 */
    .sub-nav-bar a { 
        height: var(--nav-h);
        display: flex;
        align-items: center;
        opacity: 0; 
        transform: translateX(-10px); 
        transition: 0.4s var(--ease); 
        transition-delay: calc(var(--i) * 0.05s); 
        position: relative; /* 必须为 relative，让 ::before 相对它对齐 */
    }
    .has-sub:hover .sub-nav-bar a { opacity: 1; transform: translateX(0); }

    /* 悬停反色 */
    .nav a:hover, 
    .sub-nav-bar a:hover,
    .nav-logo-zone a:hover { 
        color: #000 !important; 
    }

    /* [FIX] 导航容器层叠修正：防止主导航被其他元素遮挡或切断 */
    .nav-wrapper {
        overflow: visible !important;
    }
    .nav {
        overflow: visible !important;
    }

    /* [V1.2.9] 严格物理隔离补充 (PC 端) */
    /* 1. 严禁移动端滚动死锁样式在 PC 端生效 */
    body.menu-open {
        position: static !important;
        overflow: auto !important;
    }
    
    /* 2. 确保 PC 端不会误触 Overlay 渲染层 */
    .overlay-bg, .overlay-content {
        display: none !important;
    }
}

.menu-btn { background: none; border: none; cursor: pointer; width: 24px; height: var(--nav-h); position: relative; display: flex; align-items: center; justify-content: flex-end; pointer-events: auto; -webkit-tap-highlight-color: transparent; will-change: transform; }
.menu-btn span {
display: block; width: 24px; height: var(--icon-stroke);
background: var(--nav-active-color);
position: absolute; border-radius: 10px;
transition: all 0.4s var(--ease);
}
.line-1 { transform: translateY(-4px); } .line-2 { transform: translateY(4px); }
.menu-btn.active .line-1 { transform: translateY(0) rotate(45deg); }
.menu-btn.active .line-2 { transform: translateY(0) rotate(-45deg); }

/* iOS 26 质感 Overlay */
.overlay-bg {
position: fixed; inset: 0; z-index: 9000; opacity: 0; visibility: hidden;
transition: 0.4s var(--ease); background: rgba(255,255,255,0.25);
backdrop-filter: blur(25px) saturate(180%); -webkit-backdrop-filter: blur(25px) saturate(180%);
will-change: opacity;
}

/* [FIX] 确保激活态物理可见 */
.overlay-bg.active { 
    opacity: 1; 
    visibility: visible; 
}

.overlay-content.active { 
    opacity: 1; 
    visibility: visible; 
    transform: translateY(0); 
    /* 关键：激活时必须允许点击和滑动，否则内容无法显示且不可触控 */
    pointer-events: auto !important; 
}

/* 修正 content 基础状态，确保它飘在差值层 */
.overlay-content {
    position: fixed; inset: 0; z-index: 9001; 
    display: flex; flex-direction: column;
    padding: 100px var(--grid-gap) calc(env(safe-area-inset-bottom) + 20px) var(--grid-gap);
    opacity: 0; visibility: hidden;
    overflow-y: auto !important;
    -webkit-overflow-scrolling: touch; 
    mix-blend-mode: difference; 
    transform: translateY(-10px); 
    transition: 0.5s var(--ease);
    /* 默认关闭，由 .active 开启 */
    pointer-events: none; 
}

/* 隐藏移动端滚动条样式 */
.overlay-content::-webkit-scrollbar { display: none; }

/* [V1.2.9 FIX] 修正移动端布局：文字靠左，图标绝对靠右 */
.mobile-main-link { 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    font-size: var(--nav-font-size); 
    font-weight: 700; 
    color: #ffffff !important; /* 差值核心色 */
    width: 100%; 
    padding: 12px 0; 
    -webkit-tap-highlight-color: transparent;
}

.plus-icon {
    position: relative; 
    width: 24px; /* 与顶部汉堡包按钮宽度对齐 */
    height: 18px;
    transition: transform 0.4s var(--ease);
    flex-shrink: 0; 
    will-change: transform;
    display: flex;
    align-items: center;
    justify-content: flex-end; /* 强制内部线条向右锁定 */
}

/* 重新校准 Plus 图标线条：确保右边缘与关闭按钮(X)垂直对齐 */
.plus-icon::before, .plus-icon::after {
    content: ''; 
    position: absolute; 
    top: 50%; 
    right: 0; /* 锁定右边缘 */
    background: #ffffff !important; 
    border-radius: 10px;
}
.plus-icon::before { 
    width: 14px; 
    height: var(--icon-stroke); 
    transform: translateY(-50%); 
}
.plus-icon::after { 
    width: var(--icon-stroke); 
    height: 14px; 
    transform: translateX(-6px) translateY(-50%); /* 线条中心点精确位移 */
}

.expanded .plus-icon { transform: rotate(45deg); }

/* 优化分割线：在差值模式下提供极其克制的视觉边界 */
.mobile-link-group { 
    margin: 0; 
    border-bottom: 1px solid rgba(255,255,255,0.15); 
    width: 100%; 
}

.mobile-sub-links { display: none; flex-direction: column; padding: 10px 0 0 0; }
.mobile-sub-links.active { display: flex; }
.mobile-sub-links a { margin: 12px 0; font-size: var(--nav-font-size); color: var(--nav-active-color); }

@media (max-width: 767px) {
    /* [FIX] 物理隔离：移动端强制隐藏 PC 导航 */
    .nav-links-pc { 
        display: none !important; 
    }
    
    /* 确保汉堡包在移动端可见 */
    .menu-btn { 
        display: flex !important; 
    }

    /* [V1.2.9] 严格物理隔离补充 (移动端) */
    /* 1. 严禁 PC 端专用的 Hover 通栏背景条在移动端出现 */
    .nav a::before, 
    .sub-nav-bar a::before,
    .nav-logo-zone a::before { 
        display: none !important; 
    }

    /* 2. 确保移动端子菜单不会因为 PC 的 absolute 定位而错位 */
    .sub-nav-bar {
        position: static !important;
        opacity: 1 !important;
        visibility: visible !important;
    }
}

/* =============================================================
[SECTION: GALLERY] [LOCK]
=============================================================
*/
@keyframes skeleton-pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
.main { width: 100%; display: grid; grid-template-columns: repeat(12, 1fr); gap: var(--grid-gap); }
.media-container { position: relative; width: 100%; background: var(--skeleton-bg); overflow: hidden; line-height: 0; transition: background 0.3s ease; }
.media-container:not(.is-loaded) { animation: skeleton-pulse 1.5s infinite ease-in-out; }
.media-container.is-loaded { background: transparent; animation: none; }
.fl-cdn-shield { position: absolute; inset: 0; z-index: 10; background: transparent; cursor: default; }

.media-item { width: 100%; height: auto; display: block; transition: opacity 0.6s var(--ease); opacity: 0; }
.media-item.loaded { opacity: 1; }
.left-panel { grid-column: span 7; position: relative; height: 100vh; height: 100dvh; overflow: hidden; }
.gallery-track { display: flex; width: 100%; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
.gallery-item { min-width: 100%; scroll-snap-align: start; }
.indicators { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 20; pointer-events: none; }
.dot { width: 6px; height: 6px; border-radius: 6px; background: rgba(255,255,255,0.3); transition: width 0.4s var(--ease), background 0.3s; }
.dot.active { width: 18px; background: #fff; }
.right-panel { grid-column: span 5; height: 100vh; height: 100dvh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.right-inner { padding: calc(var(--nav-h) + var(--grid-gap) + 40px) 0 0 0; display: flex; flex-direction: column; }
.rich-text { line-height: 1.8; margin: 0 var(--grid-gap) 20px var(--grid-gap); }
.rich-text h1 { margin-bottom: 20px; font-weight: 700; }
.media-box { width: 100%; margin-bottom: var(--grid-gap); line-height: 0; }

@media (max-width: 767px) {
.main { display: block; height: auto; }
.left-panel, .right-panel { width: 100%; height: auto; }
.gallery-item img { aspect-ratio: 4 / 5; object-fit: cover; }
.right-inner { padding-top: 60px; }
.fl-cdn-shield { pointer-events: none; }
}
@media (min-width: 768px) {
.main { height: 100vh; height: 100dvh; overflow: hidden; }
.gallery-track { flex-direction: column; height: 100%; overflow-y: auto; overflow-x: hidden; scroll-snap-type: none; gap: var(--grid-gap); }
.gallery-item img { height: auto; min-height: 100%; aspect-ratio: auto; }
.indicators { display: none !important; }
}
</style>
</head>
<body oncontextmenu="return false;" ondragstart="return false;">

<div class="nav-wrapper" id="ui-nav-wrapper">
<nav class="nav">
<div class="nav-logo-zone" id="ui-nav-logo"></div>
<div class="nav-links-zone">
<div class="nav-links-pc" id="ui-nav-pc"></div>
<button class="menu-btn" id="menuBtn" onclick="toggleMenu()" aria-label="Menu">
<span class="line-1"></span><span class="line-2"></span>
</button>
</div>
</nav>
</div>

<div class="overlay-bg" id="mobileMenuBg" onclick="toggleMenu()"></div>
<div class="overlay-content" id="mobileMenuContent"></div>

<main class="main">
<section class="left-panel">
<div class="gallery-track" id="ui-left-track"></div>
<div class="indicators" id="ui-dots"></div>
</section>
<aside class="right-panel">
<div class="right-inner" id="ui-right-root"></div>
</aside>
</main>

<script>
const CONFIG = {
version: "1.2.0",
site: {
pageTitle: "ApparEdit™ - NeuePoor",
favicon: "https://cdn.neuepoor.com/apparedit/template/favicon.webp",
placeholder: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII="
},
navbar: {
logo: { text: "PoorLegalGuy®", link: "https://home.neuepoor.com/" },
links: [
{ name: "Category", url: "#", children: [
{ name: "Apparedit", url: "https://apparedit.neuepoor.com/" },
{ name: "inspo", url: "#" }, { name: "Tone", url: "#" },
{ name: "Raw", url: "#" }, { name: "Lab", url: "#" }
]},
{ name: "ApparEdit", url: "#", children: [{ name: "Archive", url: "#" }]}
]
},
gallery: {
leftMedia: [
{ url: 'https://cdn.neuepoor.com/apparedit/template/001.webp' },
{ url: 'https://cdn.neuepoor.com/apparedit/template/002.webp' },
{ url: 'https://cdn.neuepoor.com/apparedit/template/003.jpg' }
],
rightSidebar: [
{ type: 'text', title: "2603001™", titleSize: "18px", bodyTextSize: "10px", description: "DS v1.2.0 工业级加固。实现了 iOS Safari 滚动穿透死锁机制，并恢复全时差值渲染逻辑，确保顶层导航在任何 Overlay 背景下均具具备 SF Symbols 级的对比度。" },
{ type: 'media', url: 'https://cdn.neuepoor.com/apparedit/template/004.jpg' },
{ type: 'media', url: 'https://cdn.neuepoor.com/apparedit/template/005.jpg' },
{ type: 'media', url: 'https://cdn.neuepoor.com/apparedit/template/006.jpg' }
]
}
};

const DS = {
scrollTicking: false, observer: null, lastScrollY: 0,
init() {
this.initIntersectionObserver(); this.renderMeta(); this.renderNav();
this.renderGallery(); this.renderPipeline(); this.bindEvents();
},
initIntersectionObserver() {
this.observer = new IntersectionObserver((entries) => {
entries.forEach(entry => {
const video = entry.target;
if (entry.isIntersecting) video.play().catch(() => {}); else video.pause();
});
}, { threshold: 0.1 });
},
renderMeta() {
document.title = CONFIG.site.pageTitle;
const favicon = document.getElementById('ui-favicon');
if(favicon) favicon.href = CONFIG.site.favicon;
},
renderNav() {
document.getElementById('ui-nav-logo').innerHTML = `<a href="${CONFIG.navbar.logo.link}">${CONFIG.navbar.logo.text}</a>`;
const pcArea = document.getElementById('ui-nav-pc');
pcArea.innerHTML = CONFIG.navbar.links.map(link => `
    <div class="${link.children ? 'has-sub' : ''}"><a href="${link.url}">${link.name}</a>
        ${link.children ? `<div class="sub-nav-bar">
            ${link.children.map((child, idx) => `<a href="${child.url}" style="--i:${idx}">${child.name}</a>`).join('')}
        </div>` : ''}
    </div>`).join('');

const mobileArea = document.getElementById('mobileMenuContent');
mobileArea.innerHTML = CONFIG.navbar.links.map((link, idx) => `
<div class="mobile-link-group" id="m-group-${idx}">
<a href="${link.children ? 'javascript:void(0)' : link.url}" class="mobile-main-link" onclick="${link.children ? `DS.toggleSubMenu(${idx})` : 'toggleMenu()'}">
<span>${link.name}</span>${link.children ? `<span class="plus-icon"></span>` : ''}
</a>
${link.children ? `<div class="mobile-sub-links" id="m-sub-${idx}">${link.children.map(child => `<a href="${child.url}" onclick="toggleMenu()">${child.name}</a>`).join('')}</div>` : ''}
</div>`).join('');
},
renderGallery() {
document.getElementById('ui-left-track').innerHTML = CONFIG.gallery.leftMedia.map(m => `<div class="gallery-item">${this.compMedia(m.url)}</div>`).join('');
const dots = document.getElementById('ui-dots');
if (dots) dots.innerHTML = CONFIG.gallery.leftMedia.map((_, i) => `<div class="dot ${i===0?'active':''}"></div>`).join('');
},
renderPipeline() {
const pipe = document.getElementById('ui-right-root');
pipe.innerHTML = CONFIG.gallery.rightSidebar.map(item => item.type === 'text' ? this.compText(item) : `<div class="media-box">${this.compMedia(item.url)}</div>`).join('');
},
compMedia(url) {
const ext = url.split('.').pop().toLowerCase();
const isVideo = ['mp4', 'webm', 'mov'].includes(ext);
const isAudio = ['mp3', 'wav', 'ogg'].includes(ext);
let mediaHtml = isVideo ? `<video class="media-item js-fl-cdn-video" src="${url}" muted loop playsinline preload="metadata" oncanplay="DS.handleLoad(this)"></video>` :
(isAudio ? `<audio class="media-item" src="${url}" controls oncanplay="DS.handleLoad(this)"></audio>` :
`<img class="media-item" src="${url}" loading="lazy" onload="DS.handleLoad(this)" onerror="this.src='${CONFIG.site.placeholder}';DS.handleLoad(this)">`);
return `<div class="media-container"><div class="fl-cdn-shield"></div>${mediaHtml}</div>`;
},
compText(data) {
return `<div class="rich-text" style="font-family: var(--f-fallback)">
<h1 style="font-size: ${data.titleSize}">${data.title}</h1><p style="font-size: ${data.bodyTextSize}">${data.description}</p>
</div>`;
},
handleLoad(el) {
el.classList.add('loaded');
el.closest('.media-container').classList.add('is-loaded');
if (el.tagName === 'VIDEO' && this.observer) this.observer.observe(el);
},
toggleSubMenu(idx) {
document.getElementById(`m-group-${idx}`).classList.toggle('expanded');
document.getElementById(`m-sub-${idx}`).classList.toggle('active');
},
bindEvents() {
const track = document.getElementById('ui-left-track');
track.addEventListener('scroll', () => {
if (window.innerWidth >= 768) return;
if (!this.scrollTicking) {
requestAnimationFrame(() => {
const idx = Math.round(track.scrollLeft / track.offsetWidth);
document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === idx));
this.scrollTicking = false;
});
this.scrollTicking = true;
}
}, { passive: true });

window.addEventListener('resize', () => {
if (window.innerWidth >= 768 && document.body.classList.contains('menu-open')) toggleMenu();
}, { passive: true });
}
};

function preventSafariScroll(e) {
    if (!e.target.closest('#mobileMenuContent')) {
        e.preventDefault();
    }
}

function toggleMenu() {
    const bg = document.getElementById('mobileMenuBg');
    const content = document.getElementById('mobileMenuContent');
    const btn = document.getElementById('menuBtn');
    const body = document.body;
    const isOpening = !body.classList.contains('menu-open');

    if (isOpening) {
        DS.lastScrollY = window.scrollY;
        body.style.top = `-${DS.lastScrollY}px`;
        body.classList.add('menu-open');
        bg.classList.add('active');
        content.classList.add('active');
        btn.classList.add('active');
        document.addEventListener('touchmove', preventSafariScroll, { passive: false });
    } else {
        bg.classList.remove('active');
        content.classList.remove('active');
        btn.classList.remove('active');
        body.classList.remove('menu-open');
        body.style.top = '';
        window.scrollTo(0, DS.lastScrollY);
        document.removeEventListener('touchmove', preventSafariScroll);
    }
}

window.onload = () => DS.init();
</script>
</body>
</html>
