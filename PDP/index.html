<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ApparEdit™ - PoorLegalGuy®</title>
    <link rel="icon" type="image/webp" href="https://cdn.neuepoor.com/Favicon.webp">

    <style>
        /* --- 变量定义 --- */
        :root {
            --bg-panel: #fff; 
            --text: #000;
            --nav-h: 44px; 
            --grid-gap: 4px; 
            --f-fallback: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --nav-diff-color: #ffffff; 
            --fs-common: 18px; 
            /* 调整透明度为 0.65，模糊增强至 60px 以获得更深邃的质感 */
            --overlay-bg: rgba(255, 255, 255, 0.65); 
            --safe: 15px; 
            --ease: cubic-bezier(0.23, 1, 0.32, 1);
        }

        @media (prefers-color-scheme: dark) {
            :root { 
                --bg-panel: #000;
                --text: #fff; 
                --overlay-bg: rgba(0, 0, 0, 0.65);
            }
        }

        /* --- 基础复位 --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: var(--f-fallback); 
            color: var(--text);
            overflow-x: hidden; 
            -webkit-font-smoothing: antialiased;
            padding: var(--grid-gap); 
            background: var(--bg-panel);
            overscroll-behavior-y: none; 
        }

        /* --- 12栏逻辑网格 --- */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: var(--grid-gap);
        }

        /* --- Navbar 系统 --- */
        .nav {
            position: fixed; 
            top: var(--grid-gap); 
            left: var(--grid-gap);
            right: var(--grid-gap);
            height: var(--nav-h);
            z-index: 9999; 
            background: transparent; 
            mix-blend-mode: difference; 
            pointer-events: none;
            transform: translateZ(0);
            will-change: transform;
        }

        .nav-logo-zone {
            grid-column: span 3;
            display: flex;
            align-items: center;
            pointer-events: auto;
        }

        .nav-links-zone {
            grid-column: span 9;
            display: flex;
            align-items: center;
            justify-content: flex-end; 
            pointer-events: auto;
        }

        @media (min-width: 768px) {
            .nav-logo-zone { grid-column: span 1; }
            .nav-links-zone { grid-column: span 11; }
            .nav-links-pc { display: flex; gap: 30px; }
            .menu-btn { display: none; }
        }

        @media (max-width: 767px) {
            .nav-links-pc { display: none; }
            .nav-logo-zone { grid-column: span 6; }
            .nav-links-zone { grid-column: span 6; }
        }

        /* --- 导航文字样式 --- */
        .nav a {
            position: relative;
            color: var(--nav-diff-color) !important;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            font-weight: 700; 
            font-size: var(--fs-common); 
            z-index: 5;
            transition: color 0.3s var(--ease);
        }

        .logo { letter-spacing: -0.5px; }

        @media (min-width: 768px) {
            .nav a::before {
                content: '';
                position: fixed;
                top: calc(var(--grid-gap) + (var(--nav-h) / 2));
                transform: translateY(-50%);
                height: 1.2em; 
                left: 0;
                right: 0;
                background: #fff;
                opacity: 0;
                z-index: -1;
                transition: opacity 0.25s var(--ease);
                pointer-events: none;
            }
            .nav a:hover::before { opacity: 1; }
            .nav a:hover { color: #000 !important; }
        }

        /* --- 汉堡按钮 --- */
        .menu-btn { 
            background: none; border: none; cursor: pointer; padding: 5px; 
            position: relative; width: 30px; height: 30px; z-index: 10000; /* 高于 Overlay */
            pointer-events: auto;
        }
        .menu-btn span { 
            display: block; width: 20px; height: 1.5px; background: var(--nav-diff-color); 
            position: absolute; left: 5px; 
            transition: transform 0.4s var(--ease), top 0.4s var(--ease), opacity 0.3s;
        }
        .line-1 { top: 11px; }
        .line-2 { top: 19px; }
        .menu-btn.active .line-1 { top: 15px; transform: rotate(45deg); }
        .menu-btn.active .line-2 { top: 15px; transform: rotate(-45deg); }

        /* --- 移动端 Overlay (增强模糊与透明度) --- */
        .overlay {
            position: fixed; 
            inset: 0; 
            background: var(--overlay-bg); 
            /* 大幅增强模糊感从 30px 到 60px */
            backdrop-filter: blur(60px); 
            -webkit-backdrop-filter: blur(60px);
            z-index: 9000; 
            display: flex; 
            flex-direction: column;
            padding-top: calc(var(--nav-h) + 60px); 
            padding-left: var(--grid-gap); 
            opacity: 0;
            visibility: hidden;
            /* 保持 0 延迟切换背景 */
            transition: opacity 0.3s linear, visibility 0.3s linear;
        }
        .overlay.active { 
            opacity: 1; 
            visibility: visible; 
        }
        
        .overlay a { 
            font-size: var(--fs-common); 
            margin: 12px 0; 
            font-weight: 700; 
            color: var(--text) !important; 
            text-decoration: none; 
            opacity: 0; 
            transform: translateX(-10px); 
            transition: opacity 0.4s var(--ease), transform 0.4s var(--ease);
        }
        .overlay.active a {
            opacity: 1;
            transform: translateX(0);
        }
        .overlay.active a:nth-child(1) { transition-delay: 0.05s; }
        .overlay.active a:nth-child(2) { transition-delay: 0.1s; }
        .overlay.active a:nth-child(3) { transition-delay: 0.15s; }

        /* --- 主体内容 --- */
        .main { 
            width: 100%; 
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: var(--grid-gap);
        }

        @media (min-width: 768px) {
            .main { height: calc(100vh - (var(--grid-gap) * 2)); overflow: hidden; }
            .left-panel { grid-column: span 7; }
            .right-panel { grid-column: span 5; }
        }

        @media (max-width: 767px) {
            .left-panel, .right-panel { grid-column: span 12; }
            .main { display: block; }
        }

        .left-panel, .right-panel { background: var(--bg-panel); position: relative; padding: 0; }
        
        @media (min-width: 768px) {
            .left-panel { overflow: hidden; }
            .right-panel { overflow-y: auto; }
        }

        @media (max-width: 767px) {
            .left-panel { margin-bottom: var(--grid-gap); }
        }

        .gallery-track {
            display: flex; width: 100%; overflow-x: auto; 
            scroll-snap-type: x mandatory; scrollbar-width: none; 
            padding: 0; margin: 0;
        }
        .gallery-track::-webkit-scrollbar { display: none; }
        .gallery-item { min-width: 100%; scroll-snap-align: start; }
        .gallery-item img { width: 100%; display: block; object-fit: cover; aspect-ratio: 4 / 5; }

        @media (min-width: 768px) {
            .gallery-track { flex-direction: column; height: 100%; overflow-y: auto; scroll-snap-type: none; gap: var(--grid-gap); }
            .gallery-item img { height: auto; min-height: 100%; aspect-ratio: auto; }
        }

        .right-inner { 
            padding: calc(var(--nav-h) + 12px) 0 0 0; 
            margin: 0; display: flex; flex-direction: column;
        }

        .rich-text { font-size: 11px; line-height: 1.8; margin: 0 var(--grid-gap); }
        .rich-text h1 { font-size: 20px; margin-bottom: 20px; font-weight: 700; }
        .rich-text p { margin-bottom: 15px; opacity: 0.9; }
        
        .media-box { width: 100%; margin-bottom: var(--grid-gap); line-height: 0; font-size: 0; }
        .media-box img { width: 100%; height: auto; display: block; vertical-align: middle; }

        .indicators {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 8px; z-index: 10;
        }
        @media (min-width: 768px) { .indicators { display: none; } }
        .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.3); transition: 0.3s; }
        .dot.active { background: #fff; transform: scale(1.3); }
    </style>
</head>
<body>

    <nav class="nav grid-container">
        <div class="nav-logo-zone">
            <a href="https://home.neuepoor.com/" class="logo">PoorLegalGuy®</a>
        </div>
        <div class="nav-links-zone">
            <div class="nav-links-pc">
                <a href="https://home.neuepoor.com">Category</a>
                <a href="https://apparedit.neuepoor.com/">ApparEdit</a>
                <a href="https://apparedit.neuepoor.com/PDP">PDP</a>
            </div>
            <button class="menu-btn" id="menuBtn" onclick="toggleMenu()" aria-label="Menu">
                <span class="line-1"></span>
                <span class="line-2"></span>
            </button>
        </div>
    </nav>

    <div class="overlay" id="mobileMenu">
        <a href="https://home.neuepoor.com" onclick="toggleMenu()">Category</a>
        <a href="https://apparedit.neuepoor.com/" onclick="toggleMenu()">ApparEdit</a>
        <a href="https://apparedit.neuepoor.com/PDP" onclick="toggleMenu()">PDP</a>
    </div>

    <main class="main">
        <section class="left-panel">
            <div class="gallery-track" id="ui-left-track"></div>
            <div class="indicators" id="ui-dots"></div>
        </section>

        <aside class="right-panel">
            <div class="right-inner" id="ui-right-root"></div>
        </aside>
    </main>

    <script>
        const APP_DATA = {
            leftGallery: [
                "https://cdn.neuepoor.com/apparedit/Template/a.webp",
                "https://cdn.neuepoor.com/apparedit/Template/b.webp",
                "https://cdn.neuepoor.com/apparedit/Template/c.jpg"
            ], 
            rightTitle: "ApparEdit™",
            rightBlocks: [
                { t: "p", v: "测试一下的选项，if this support poorlegalguy." },
                { t: "img", v: "https://cdn.neuepoor.com/apparedit/Template/1.jpg" },
                { t: "p", v: "这不仅仅是一个编辑器，它代表了我们对内容创作边界的重新思考。" },
                { t: "img", v: "https://cdn.neuepoor.com/apparedit/Template/2.jpg" },
                { t: "p", v: "通过 12 栏格栅系统，我们构建了数字内容的建筑学。" },
                { t: "img", v: "https://cdn.neuepoor.com/apparedit/Template/3.jpg" },
                { t: "img", v: "https://cdn.neuepoor.com/apparedit/Template/4.jpg" }
            ]
        };

        function toggleMenu() {
            if (window.innerWidth >= 768) return;
            const menu = document.getElementById('mobileMenu');
            const btn = document.getElementById('menuBtn');
            const isActive = menu.classList.toggle('active');
            btn.classList.toggle('active');
            
            document.body.style.overflow = isActive ? 'hidden' : '';
            document.documentElement.style.overflow = isActive ? 'hidden' : '';
        }

        function init() {
            const track = document.getElementById('ui-left-track');
            const dotsContainer = document.getElementById('ui-dots');

            track.innerHTML = APP_DATA.leftGallery.map(src => `
                <div class="gallery-item"><img src="${src}"></div>
            `).join('');

            dotsContainer.innerHTML = APP_DATA.leftGallery.map((_, i) => `
                <div class="dot ${i === 0 ? 'active' : ''}"></div>
            `).join('');

            track.addEventListener('scroll', () => {
                const index = Math.round(track.scrollLeft / track.offsetWidth);
                const dots = dotsContainer.querySelectorAll('.dot');
                dots.forEach((dot, i) => {
                    dot.classList.toggle('active', i === index);
                });
            }, { passive: true });

            document.getElementById('ui-right-root').innerHTML = `
                <div class="rich-text">
                    <h1>${APP_DATA.rightTitle}</h1>
                </div>
                ${APP_DATA.rightBlocks.map(b => 
                    b.t === 'p' ? `<div class="rich-text"><p>${b.v}</p></div>` : `<div class="media-box"><img src="${b.v}"></div>`
                ).join('')}
            `;
        }

        window.onload = init;
        window.onresize = () => {
            if (window.innerWidth >= 768) {
                document.getElementById('mobileMenu').classList.remove('active');
                document.getElementById('menuBtn').classList.remove('active');
                document.body.style.overflow = '';
                document.documentElement.style.overflow = '';
            }
        };
    </script>
</body>
</html>
