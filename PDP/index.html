<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title id="ui-title">Loading...</title>
    <link rel="icon" id="ui-favicon" type="image/webp" href="">

    <style>
        /* =============================================================
           [GLOBAL VARIABLES]
           ============================================================= */
        :root {
            --bg-panel: #fff; 
            --text: #000; 
            --nav-h: 32px; 
            --grid-gap: 4px; 
            --f-fallback: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --nav-diff-color: #ffffff; 
            --ease: cubic-bezier(0.23, 1, 0.32, 1); 
            --nav-weight: 700;
        }
        @media (prefers-color-scheme: dark) { :root { --bg-panel: #000; --text: #fff; } }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: var(--f-fallback); 
            color: var(--text); 
            overflow-x: hidden; 
            background: var(--bg-panel); 
            /* 使用 dvh 确保 body 初始高度适配动态视口 */
            min-height: 100dvh; 
        }

        /* =============================================================
           [NAVBAR COMPONENT]
           ============================================================= */
        .nav-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 9999;
            mix-blend-mode: difference;
            pointer-events: none;
        }

        .nav { 
            padding: var(--grid-gap) var(--grid-gap) 0 var(--grid-gap);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo-zone, .nav-links-zone { 
            pointer-events: auto; 
            display: flex; 
            align-items: center; 
            height: var(--nav-h); 
        }

        .nav a, .sub-nav-bar a { 
            color: var(--nav-diff-color) !important; 
            text-decoration: none; 
            font-weight: var(--nav-weight); 
            display: flex;
            align-items: center;
            white-space: nowrap;
        }

        .sub-nav-bar {
            position: absolute;
            top: 100%;
            left: 0;
            display: none;
            flex-direction: column;
            pointer-events: auto;
            width: fit-content;
        }

        .nav-links-pc > div:hover .sub-nav-bar { display: flex; }
        .nav-links-pc { display: none; } 

        .menu-btn { 
            background: none; border: none; cursor: pointer; 
            width: 24px; height: var(--nav-h); 
            position: relative; display: flex; align-items: center; justify-content: flex-end;
        }
        .menu-btn span { display: block; width: 24px; height: 1.5px; background: #fff; position: absolute; transition: all 0.4s var(--ease); }
        .line-1 { transform: translateY(-4px); }
        .line-2 { transform: translateY(4px); }
        .menu-btn.active .line-1 { transform: translateY(0) rotate(45deg); }
        .menu-btn.active .line-2 { transform: translateY(0) rotate(-45deg); }

        @media (min-width: 768px) {
            .nav-links-pc { display: flex; gap: 30px; height: 100%; position: relative; }
            .menu-btn { display: none; }
            .has-sub { height: 100%; display: flex; align-items: center; position: relative; }
            
            .nav a:hover::before, .sub-nav-bar a:hover::before { 
                content: ''; 
                position: fixed; 
                left: 0; 
                right: 0; 
                height: 1.2em; 
                background: #fff; 
                z-index: -1; 
                pointer-events: none;
            }
            .nav a:hover::before { top: calc(var(--grid-gap) + (var(--nav-h)/2)); transform: translateY(-50%); }
            .sub-nav-bar a:hover::before { top: auto; transform: translateY(-5%); height: 1.2em; }

            .nav a:hover, .sub-nav-bar a:hover { color: #000 !important; }
            .sub-nav-bar a { height: var(--nav-h); padding: 0; }
        }

        /* =============================================================
           [LAYOUT & GALLERY]
           ============================================================= */
        .main { width: 100%; display: grid; grid-template-columns: repeat(12, 1fr); gap: var(--grid-gap); }
        
        @media (min-width: 768px) {
            .main { height: 100vh; overflow: hidden; }
            .left-panel { grid-column: span 7; height: 100%; overflow: hidden; position: relative; }
            .right-panel { grid-column: span 5; height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; }
            .indicators { display: none; }
        }

        @media (max-width: 767px) { 
            .left-panel { grid-column: span 12; position: relative; } 
            .right-panel { grid-column: span 12; } 
            .main { display: block; height: auto; } 
            .indicators { 
                position: absolute; 
                bottom: 15px; 
                left: 50%; 
                transform: translateX(-50%); 
                display: flex; 
                gap: 8px; 
                z-index: 10; 
                pointer-events: none;
            }
        }

        .gallery-track { display: flex; width: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
        .gallery-track::-webkit-scrollbar, .right-panel::-webkit-scrollbar { display: none; }
        .gallery-track, .right-panel { scrollbar-width: none; -ms-overflow-style: none; }

        .gallery-item { min-width: 100%; scroll-snap-align: start; }
        .gallery-item img { width: 100%; display: block; object-fit: cover; aspect-ratio: 4 / 5; }

        @media (min-width: 768px) {
            .gallery-track { flex-direction: column; height: 100%; overflow-y: auto; overflow-x: hidden; scroll-snap-type: none; gap: var(--grid-gap); }
            .gallery-item img { height: auto; min-height: 100%; aspect-ratio: auto; }
        }

        .right-inner { padding: calc(var(--nav-h) + var(--grid-gap) + 40px) 0 0 0; display: flex; flex-direction: column; }
        @media (max-width: 767px) { .right-inner { padding-top: 60px; } }
        .rich-text { line-height: 1.8; margin: 0 var(--grid-gap) 20px var(--grid-gap); }
        .rich-text h1 { margin-bottom: 20px; font-weight: 700; }
        
        .media-box { width: 100%; margin-bottom: var(--grid-gap); line-height: 0; }
        .media-box img { width: 100%; height: auto; display: block; }

        .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.3); transition: 0.3s; }
        .dot.active { background: #fff; transform: scale(1.3); }

        /* [MOBILE OVERLAY] - 针对 Safari dvh 优化 */
        .overlay-bg { 
            position: fixed; 
            inset: 0; /* 强制覆盖 top/bottom/left/right: 0 */
            z-index: 9000; 
            opacity: 0; 
            visibility: hidden; 
            transition: 0.3s; 
            background: rgba(255,255,255,0.3); 
            backdrop-filter: blur(40px); 
            -webkit-backdrop-filter: blur(40px); 
            height: 100dvh; /* 动态视口高度，解决 Safari 地址栏收缩黑边问题 */
        }

        .overlay-content { 
            position: fixed; 
            inset: 0; 
            z-index: 9001; 
            display: flex; 
            flex-direction: column; 
            padding: 80px var(--grid-gap) calc(env(safe-area-inset-bottom) + 20px) var(--grid-gap); 
            opacity: 0; 
            visibility: hidden; 
            mix-blend-mode: difference; 
            overflow-y: auto; 
            overflow-x: hidden; 
            width: 100%;
            height: 100dvh; /* 同样使用 dvh */
            scrollbar-width: none; 
            -ms-overflow-style: none;
            -webkit-overflow-scrolling: touch;
        }
        .overlay-content::-webkit-scrollbar { display: none; }
        .overlay-bg.active, .overlay-content.active { opacity: 1; visibility: visible; }
        
        .mobile-link-group { margin: 15px 0; border-bottom: 0.5px solid rgba(255,255,255,0.2); padding-bottom: 10px; width: 100%; }
        .mobile-main-link { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-size: 18px; 
            font-weight: 700; 
            color: #fff; 
            text-decoration: none; 
            width: 100%;
        }
        .mobile-sub-links { display: none; flex-direction: column; padding: 10px 0 0 0; }
        .mobile-sub-links.active { display: flex; }
        .mobile-sub-links a { 
            margin: 12px 0; 
            font-size: 18px; 
            color: #fff; 
            text-decoration: none; 
        }
        .plus-icon { 
            font-size: 20px; 
            font-weight: 300; 
            transition: transform 0.3s; 
            margin-left: 10px;
            flex-shrink: 0; 
        }
        .expanded .plus-icon { transform: rotate(45deg); }
    </style>
</head>
<body>

    <div class="nav-wrapper">
        <nav class="nav">
            <div class="nav-logo-zone" id="ui-nav-logo"></div>
            <div class="nav-links-zone">
                <div class="nav-links-pc" id="ui-nav-pc"></div>
                <button class="menu-btn" id="menuBtn" onclick="toggleMenu()" aria-label="Menu">
                    <span class="line-1"></span><span class="line-2"></span>
                </button>
            </div>
        </nav>
    </div>

    <div class="overlay-bg" id="mobileMenuBg"></div>
    <div class="overlay-content" id="mobileMenuContent"></div>

    <main class="main">
        <section class="left-panel">
            <div class="gallery-track" id="ui-left-track"></div>
            <div class="indicators" id="ui-dots"></div>
        </section>
        <aside class="right-panel">
            <div class="right-inner" id="ui-right-root"></div>
            <div id="ui-right-media"></div>
        </aside>
    </main>

    <script>
        const CONFIG = {
            site: { pageTitle: "ApparEdit™ - NeuePoor", favicon: "https://cdn.neuepoor.com/Favicon.webp" },
            navbar: {
                logo: { text: "PoorLegalGuy®", fontSize: "18px", link: "https://home.neuepoor.com/" },
                links: [
                    { 
                        name: "Category", 
                        url: "#", 
                        fontSize: "18px",
                        children: [
                            { name: "Apparedit", url: "https://apparedit.neuepoor.com/" },
                            { name: "inspo", url: "#" },
                            { name: "Tone", url: "#" },
                            { name: "Raw", url: "#" },
                            { name: "Lab", url: "#" }
                        ]
                    },
                    { 
                        name: "ApparEdit", 
                        url: "#", 
                        fontSize: "18px",
                        children: [
                            { name: "Archive", url: "#" }
                        ]
                    }
                ]
            },
            gallery: {
                leftMedia: [
                    { type: 'image', url: 'https://cdn.neuepoor.com/apparedit/template/001.webp' },
                    { type: 'image', url: 'https://cdn.neuepoor.com/apparedit/template/002.webp' },
                    { type: 'image', url: 'https://cdn.neuepoor.com/apparedit/template/003.jpg' }
                ],
                rightContent: {
                    title: "2603001™",
                    titleSize: "18px",
                    bodyTextSize: "10px",
                    description: "已针对 Safari 优化：使用 dvh 单位定义菜单高度，确保在地址栏动态收缩时依然能保持全屏模糊覆盖，解决了上下黑边或未对齐的问题。"
                },
                rightMedia: [
                    { type: 'image', url: 'https://cdn.neuepoor.com/apparedit/template/004.jpg' },
                    { type: 'image', url: 'https://cdn.neuepoor.com/apparedit/template/005.jpg' },
                    { type: 'image', url: 'https://cdn.neuepoor.com/apparedit/template/006.jpg' }
                ]
            }
        };

        function renderUI() {
            const logoArea = document.getElementById('ui-nav-logo');
            logoArea.innerHTML = `<a href="${CONFIG.navbar.logo.link}" style="font-size: ${CONFIG.navbar.logo.fontSize}">${CONFIG.navbar.logo.text}</a>`;
            
            const pcArea = document.getElementById('ui-nav-pc');
            pcArea.innerHTML = CONFIG.navbar.links.map(link => `
                <div class="${link.children ? 'has-sub' : ''}">
                    <a href="${link.url}" style="font-size: ${link.fontSize}">${link.name}</a>
                    ${link.children ? `
                        <div class="sub-nav-bar">
                            ${link.children.map(child => `<a href="${child.url}" style="font-size: ${link.fontSize}">${child.name}</a>`).join('')}
                        </div>
                    ` : ''}
                </div>
            `).join('');
            
            const mobileArea = document.getElementById('mobileMenuContent');
            mobileArea.innerHTML = CONFIG.navbar.links.map((link, idx) => `
                <div class="mobile-link-group" id="m-group-${idx}">
                    <a href="${link.children ? 'javascript:void(0)' : link.url}" 
                       class="mobile-main-link" 
                       onclick="${link.children ? `toggleSubMenu(${idx})` : 'toggleMenu()'}">
                        <span>${link.name}</span>
                        ${link.children ? `<span class="plus-icon">+</span>` : ''}
                    </a>
                    ${link.children ? `
                        <div class="mobile-sub-links" id="m-sub-${idx}">
                            ${link.children.map(child => `<a href="${child.url}" onclick="toggleMenu()">${child.name}</a>`).join('')}
                        </div>
                    ` : ''}
                </div>
            `).join('');

            const leftTrack = document.getElementById('ui-left-track');
            leftTrack.innerHTML = CONFIG.gallery.leftMedia.map(m => `
                <div class="gallery-item"><img src="${m.url}" loading="lazy" decoding="async"></div>
            `).join('');

            const rightRoot = document.getElementById('ui-right-root');
            rightRoot.innerHTML = `<div class="rich-text"><h1 style="font-size: ${CONFIG.gallery.rightContent.titleSize}">${CONFIG.gallery.rightContent.title}</h1><p style="font-size: ${CONFIG.gallery.rightContent.bodyTextSize}">${CONFIG.gallery.rightContent.description}</p></div>`;

            const rightMediaArea = document.getElementById('ui-right-media');
            rightMediaArea.innerHTML = CONFIG.gallery.rightMedia.map(m => `<div class="media-box"><img src="${m.url}" loading="lazy" decoding="async"></div>`).join('');

            renderDots(CONFIG.gallery.leftMedia.length);
            bindEvents();
        }

        function toggleSubMenu(index) {
            const group = document.getElementById(`m-group-${index}`);
            const sub = document.getElementById(`m-sub-${index}`);
            group.classList.toggle('expanded');
            sub.classList.toggle('active');
        }

        function renderDots(count) {
            const dotsContainer = document.getElementById('ui-dots');
            if (dotsContainer) dotsContainer.innerHTML = Array.from({ length: count }).map((_, i) => `<div class="dot ${i === 0 ? 'active' : ''}"></div>`).join('');
        }

        function bindEvents() {
            const track = document.getElementById('ui-left-track');
            if (!track) return;
            track.addEventListener('scroll', () => {
                const index = Math.round(track.scrollLeft / track.offsetWidth);
                const dots = document.querySelectorAll('.dot');
                dots.forEach((dot, i) => dot.classList.toggle('active', i === index));
            }, { passive: true });
        }

        function toggleMenu() {
            const bg = document.getElementById('mobileMenuBg');
            const content = document.getElementById('mobileMenuContent');
            const btn = document.getElementById('menuBtn');
            const isActive = bg.classList.toggle('active');
            
            content.classList.toggle('active');
            btn.classList.toggle('active');
            
            // 锁定 body 滚动
            if (isActive) {
                document.body.style.overflow = 'hidden';
                // 针对旧版 iOS 的额外保障
                document.addEventListener('touchmove', preventDefaultScroll, { passive: false });
            } else {
                document.body.style.overflow = '';
                document.removeEventListener('touchmove', preventDefaultScroll);
            }
        }

        function preventDefaultScroll(e) {
            // 如果是在菜单内部滚动则允许，背景则拦截
            if (!e.target.closest('.overlay-content')) {
                e.preventDefault();
            }
        }

        window.onload = renderUI;
    </script>
</body>
</html>
