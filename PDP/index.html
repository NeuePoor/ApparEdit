<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title id="ui-title">Loading...</title>
    <link rel="icon" id="ui-favicon" type="image/webp" href="">

    <style>
        /* =============================================================
           [GLOBAL VARIABLES]
           ============================================================= */
        :root {
            --bg-panel: #fff; 
            --text: #000; 
            --nav-h: 32px; 
            --grid-gap: 4px; 
            --f-fallback: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --nav-diff-color: #ffffff; 
            --ease: cubic-bezier(0.23, 1, 0.32, 1); 
            --nav-weight: 700;
            --skeleton-bg: #f0f0f0; 
        }
        @media (prefers-color-scheme: dark) { 
            :root { --bg-panel: #000; --text: #fff; --skeleton-bg: #1a1a1a; } 
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-touch-callout: none; }
        
        body { 
            font-family: var(--f-fallback); 
            color: var(--text); 
            overflow-x: hidden; 
            background: var(--bg-panel); 
            min-height: 100dvh; 
        }

        /* =============================================================
           [NAVBAR]
           ============================================================= */
        .nav-wrapper { position: fixed; top: 0; left: 0; right: 0; z-index: 9999; mix-blend-mode: difference; pointer-events: none; }
        .nav { padding: var(--grid-gap) var(--grid-gap) 0 var(--grid-gap); display: flex; justify-content: space-between; align-items: center; }
        .nav-logo-zone, .nav-links-zone { pointer-events: auto; display: flex; align-items: center; height: var(--nav-h); }
        .nav a, .sub-nav-bar a { color: var(--nav-diff-color) !important; text-decoration: none; font-weight: var(--nav-weight); display: flex; align-items: center; white-space: nowrap; }
        
        .sub-nav-bar { position: absolute; top: 100%; left: 0; display: none; flex-direction: column; pointer-events: auto; width: fit-content; }
        .nav-links-pc > div:hover .sub-nav-bar { display: flex; }
        .nav-links-pc { display: none; } 

        .menu-btn { background: none; border: none; cursor: pointer; width: 24px; height: var(--nav-h); position: relative; display: flex; align-items: center; justify-content: flex-end; }
        .menu-btn span { display: block; width: 24px; height: 1.5px; background: #fff; position: absolute; transition: all 0.4s var(--ease); }
        .line-1 { transform: translateY(-4px); } .line-2 { transform: translateY(4px); }
        .menu-btn.active .line-1 { transform: translateY(0) rotate(45deg); }
        .menu-btn.active .line-2 { transform: translateY(0) rotate(-45deg); }

        @media (min-width: 768px) {
            .nav-links-pc { display: flex; gap: 30px; height: 100%; position: relative; }
            .menu-btn { display: none; }
            .has-sub { height: 100%; display: flex; align-items: center; position: relative; }
            .nav a:hover::before, .sub-nav-bar a:hover::before { content: ''; position: fixed; left: 0; right: 0; height: 1.2em; background: #fff; z-index: -1; pointer-events: none; }
            .nav a:hover::before { top: calc(var(--grid-gap) + (var(--nav-h)/2)); transform: translateY(-50%); }
            .sub-nav-bar a:hover::before { top: auto; transform: translateY(-5%); height: 1.2em; }
            .nav a:hover, .sub-nav-bar a:hover { color: #000 !important; }
            .sub-nav-bar a { height: var(--nav-h); padding: 0; }
        }

        /* =============================================================
           [MEDIA ENGINE]
           ============================================================= */
        .media-container { 
            position: relative; 
            width: 100%; 
            background: var(--skeleton-bg); 
            overflow: hidden; 
            line-height: 0; 
            transition: background 0.3s ease;
        }
        .media-container.is-loaded { background: transparent; }

        .media-shield { position: absolute; inset: 0; z-index: 5; background: transparent; cursor: default; }
        .media-item { width: 100%; height: auto; display: block; transition: opacity 0.6s var(--ease); opacity: 0; }
        .media-item.loaded { opacity: 1; }
        
        .ratio-box { position: relative; width: 100%; aspect-ratio: 16 / 9; }
        .ratio-box iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }

        /* =============================================================
           [LAYOUT]
           ============================================================= */
        .main { width: 100%; display: grid; grid-template-columns: repeat(12, 1fr); gap: var(--grid-gap); }
        
        @media (min-width: 768px) {
            .main { height: 100vh; overflow: hidden; }
            .left-panel { grid-column: span 7; height: 100%; overflow: hidden; position: relative; }
            .right-panel { grid-column: span 5; height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; }
            .indicators { display: none; }
        }

        @media (max-width: 767px) { 
            .left-panel { grid-column: span 12; position: relative; } 
            .right-panel { grid-column: span 12; } 
            .main { display: block; height: auto; } 
            .indicators { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 10; pointer-events: none; }
        }

        .gallery-track { display: flex; width: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
        .gallery-track::-webkit-scrollbar, .right-panel::-webkit-scrollbar { display: none; }

        .gallery-item { min-width: 100%; scroll-snap-align: start; }
        .gallery-item .media-container img { aspect-ratio: 4 / 5; object-fit: cover; }

        @media (min-width: 768px) {
            .gallery-track { flex-direction: column; height: 100%; overflow-y: auto; overflow-x: hidden; scroll-snap-type: none; gap: var(--grid-gap); }
            .gallery-item .media-container img { height: auto; min-height: 100%; aspect-ratio: auto; }
        }

        .right-inner { padding: calc(var(--nav-h) + var(--grid-gap) + 40px) 0 0 0; display: flex; flex-direction: column; }
        @media (max-width: 767px) { .right-inner { padding-top: 60px; } }
        .rich-text { line-height: 1.8; margin: 0 var(--grid-gap) 20px var(--grid-gap); }
        .rich-text h1 { margin-bottom: 20px; font-weight: 700; }
        .media-box { width: 100%; margin-bottom: var(--grid-gap); line-height: 0; }

        .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.3); transition: 0.3s; }
        .dot.active { background: #fff; transform: scale(1.3); }

        .overlay-bg { position: fixed; inset: 0; z-index: 9000; opacity: 0; visibility: hidden; transition: 0.3s; background: rgba(255,255,255,0.3); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px); height: 100dvh; }
        .overlay-content { position: fixed; inset: 0; z-index: 9001; display: flex; flex-direction: column; padding: 80px var(--grid-gap) calc(env(safe-area-inset-bottom) + 20px) var(--grid-gap); opacity: 0; visibility: hidden; mix-blend-mode: difference; overflow-y: auto; overflow-x: hidden; width: 100%; height: 100dvh; scrollbar-width: none; }
        .overlay-bg.active, .overlay-content.active { opacity: 1; visibility: visible; }
        
        .mobile-link-group { margin: 15px 0; border-bottom: 0.5px solid rgba(255,255,255,0.2); padding-bottom: 10px; width: 100%; }
        .mobile-main-link { display: flex; justify-content: space-between; align-items: center; font-size: 18px; font-weight: 700; color: #fff; text-decoration: none; width: 100%; }
        .mobile-sub-links { display: none; flex-direction: column; padding: 10px 0 0 0; }
        .mobile-sub-links.active { display: flex; }
        .mobile-sub-links a { margin: 12px 0; font-size: 18px; color: #fff; text-decoration: none; }
        .plus-icon { font-size: 20px; transition: transform 0.3s; margin-left: 10px; flex-shrink: 0; }
        .expanded .plus-icon { transform: rotate(45deg); }
    </style>
</head>
<body oncontextmenu="return false;" ondragstart="return false;">

    <div class="nav-wrapper">
        <nav class="nav">
            <div class="nav-logo-zone" id="ui-nav-logo"></div>
            <div class="nav-links-zone">
                <div class="nav-links-pc" id="ui-nav-pc"></div>
                <button class="menu-btn" id="menuBtn" onclick="toggleMenu()" aria-label="Menu">
                    <span class="line-1"></span><span class="line-2"></span>
                </button>
            </div>
        </nav>
    </div>

    <div class="overlay-bg" id="mobileMenuBg"></div>
    <div class="overlay-content" id="mobileMenuContent"></div>

    <main class="main">
        <section class="left-panel">
            <div class="gallery-track" id="ui-left-track"></div>
            <div class="indicators" id="ui-dots"></div>
        </section>
        <aside class="right-panel">
            <div class="right-inner" id="ui-right-root"></div>
        </aside>
    </main>

    <script>
        /**
         * 1. 核心配置区域
         */
        const CONFIG = {
            site: { 
                pageTitle: "ApparEdit™ - NeuePoor", 
                favicon: "https://cdn.neuepoor.com/apparedit/template/favicon.webp",
                placeholder: "https://via.placeholder.com/800x1000?text=Asset+Unavailable" 
            },
            navbar: {
                logo: { text: "PoorLegalGuy®", fontSize: "18px", link: "https://home.neuepoor.com/" },
                links: [
                    { 
                        name: "Category", 
                        url: "#", 
                        fontSize: "18px",
                        children: [
                            { name: "Apparedit", url: "https://apparedit.neuepoor.com/" },
                            { name: "inspo", url: "#" },
                            { name: "Tone", url: "#" },
                            { name: "Raw", url: "#" },
                            { name: "Lab", url: "#" }
                        ]
                    },
                    { 
                        name: "ApparEdit", 
                        url: "#", 
                        fontSize: "18px",
                        children: [
                            { name: "Archive", url: "#" }
                        ]
                    }
                ]
            },
            gallery: {
                // 左侧滚动媒体库
                leftMedia: [
                    { url: 'https://cdn.neuepoor.com/apparedit/template/001.webp' },
                    { url: 'https://cdn.neuepoor.com/apparedit/template/002.webp' },
                    { url: 'https://cdn.neuepoor.com/apparedit/template/003.jpg' }
                ],
                // 右侧栏混合流水线 (按数组顺序排列渲染)
                rightSidebar: [
                    { 
                        type: 'text', 
                        title: "2603001™", 
                        titleSize: "18px",
                        bodyTextSize: "10px",
                        description: "已修复：预览已重新打开。透明 PNG 背景穿透问题已解决。配置项已优化，site.pageTitle 自动同步至 DOM，rightSidebar 支持按顺序排列文字与媒体。"
                    },
                    { type: 'media', url: 'https://cdn.neuepoor.com/apparedit/template/004.jpg' },
                    { type: 'media', url: 'https://cdn.neuepoor.com/apparedit/template/005.jpg' },
                    { type: 'media', url: 'https://cdn.neuepoor.com/apparedit/template/006.jpg' }
                ]
            }
        };

        /**
         * 2. 引擎逻辑
         */
        function handleMediaLoad(el) {
            el.classList.add('loaded');
            const container = el.closest('.media-container');
            if (container) container.classList.add('is-loaded');
        }

        function renderMedia(url) {
            const ext = url.split('.').pop().toLowerCase();
            const isVideo = ['mp4', 'webm', 'mov'].includes(ext);
            const isIframe = url.includes('youtube.com') || url.includes('vimeo.com') || ext === 'html';

            let mediaHtml = '';
            if (isVideo) {
                mediaHtml = `<video class="media-item" src="${url}" muted loop playsinline autoplay preload="metadata" oncanplay="handleMediaLoad(this)"></video>`;
            } else if (isIframe) {
                mediaHtml = `<div class="ratio-box"><iframe src="${url}" allowfullscreen onload="handleMediaLoad(this.nextElementSibling)"></iframe><div class="media-item"></div></div>`;
            } else {
                mediaHtml = `<img class="media-item" src="${url}" loading="lazy" decoding="async" draggable="false" 
                              onload="handleMediaLoad(this)" 
                              onerror="this.src='${CONFIG.site.placeholder}'; handleMediaLoad(this)">`;
            }

            return `
                <div class="media-container">
                    <div class="media-shield"></div>
                    ${mediaHtml}
                </div>
            `;
        }

        /**
         * 3. 初始化渲染
         */
        function init() {
            // Site Meta
            document.title = CONFIG.site.pageTitle;
            const favicon = document.getElementById('ui-favicon');
            if(favicon) favicon.href = CONFIG.site.favicon;

            // Navbar
            const logoArea = document.getElementById('ui-nav-logo');
            logoArea.innerHTML = `<a href="${CONFIG.navbar.logo.link}" style="font-size: ${CONFIG.navbar.logo.fontSize}">${CONFIG.navbar.logo.text}</a>`;
            
            const pcArea = document.getElementById('ui-nav-pc');
            pcArea.innerHTML = CONFIG.navbar.links.map(link => `
                <div class="${link.children ? 'has-sub' : ''}">
                    <a href="${link.url}" style="font-size: ${link.fontSize}">${link.name}</a>
                    ${link.children ? `
                        <div class="sub-nav-bar">
                            ${link.children.map(child => `<a href="${child.url}" style="font-size: ${link.fontSize}">${child.name}</a>`).join('')}
                        </div>
                    ` : ''}
                </div>
            `).join('');
            
            const mobileArea = document.getElementById('mobileMenuContent');
            mobileArea.innerHTML = CONFIG.navbar.links.map((link, idx) => `
                <div class="mobile-link-group" id="m-group-${idx}">
                    <a href="${link.children ? 'javascript:void(0)' : link.url}" 
                       class="mobile-main-link" 
                       onclick="${link.children ? `toggleSubMenu(${idx})` : 'toggleMenu()'}">
                        <span>${link.name}</span>
                        ${link.children ? `<span class="plus-icon">+</span>` : ''}
                    </a>
                    ${link.children ? `
                        <div class="mobile-sub-links" id="m-sub-${idx}">
                            ${link.children.map(child => `<a href="${child.url}" onclick="toggleMenu()">${child.name}</a>`).join('')}
                        </div>
                    ` : ''}
                </div>
            `).join('');

            // Left Gallery
            document.getElementById('ui-left-track').innerHTML = CONFIG.gallery.leftMedia.map(m => `
                <div class="gallery-item">${renderMedia(m.url)}</div>
            `).join('');

            // Right Sidebar Pipeline
            const rightContainer = document.getElementById('ui-right-root');
            rightContainer.innerHTML = CONFIG.gallery.rightSidebar.map(item => {
                if (item.type === 'text') {
                    return `
                        <div class="rich-text">
                            <h1 style="font-size: ${item.titleSize}">${item.title}</h1>
                            <p style="font-size: ${item.bodyTextSize}">${item.description}</p>
                        </div>`;
                } else if (item.type === 'media') {
                    return `<div class="media-box">${renderMedia(item.url)}</div>`;
                }
                return '';
            }).join('');

            renderDots(CONFIG.gallery.leftMedia.length);
            bindEvents();
        }

        function toggleSubMenu(index) {
            const group = document.getElementById(`m-group-${index}`);
            const sub = document.getElementById(`m-sub-${index}`);
            group.classList.toggle('expanded');
            sub.classList.toggle('active');
        }

        function renderDots(n) {
            const container = document.getElementById('ui-dots');
            if (container) container.innerHTML = Array.from({length:n}).map((_,i)=>`<div class="dot ${i===0?'active':''}"></div>`).join('');
        }

        function bindEvents() {
            const track = document.getElementById('ui-left-track');
            track.addEventListener('scroll', () => {
                const idx = Math.round(track.scrollLeft / track.offsetWidth);
                document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === idx));
            }, { passive: true });
        }

        function toggleMenu() {
            const bg = document.getElementById('mobileMenuBg');
            const content = document.getElementById('mobileMenuContent');
            const btn = document.getElementById('menuBtn');
            bg.classList.toggle('active');
            content.classList.toggle('active');
            btn.classList.toggle('active');
            const isActive = bg.classList.contains('active');
            document.body.style.overflow = isActive ? 'hidden' : '';
            if (isActive) document.addEventListener('touchmove', preventDefaultScroll, { passive: false });
            else document.removeEventListener('touchmove', preventDefaultScroll);
        }

        function preventDefaultScroll(e) {
            if (!e.target.closest('.overlay-content')) e.preventDefault();
        }

        window.onload = init;
    </script>
</body>
</html>
