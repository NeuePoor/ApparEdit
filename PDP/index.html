<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff" id="theme-meta">
    <title>Loading...</title>
    <link rel="icon" id="ui-favicon" type="image/webp" href="">

    <style>
        /* [LOCK] ======================================================
           DESIGN TOKENS & SYSTEM BASE
           ============================================================= */
        :root {
            --bg-panel: #fff;
            --text-main: #000;
            --text-inv: #fff;
            --nav-h: 32px;
            --grid-gap: 4px;
            --f-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --ease-in-out: cubic-bezier(0.23, 1, 0.32, 1);
            --skeleton-bg: #f0f0f0;
            --nav-weight: 700;
            --overlay-bg: rgba(255, 255, 255, 0.85); 
            --overlay-blur: 30px;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-panel: #000;
                --text-main: #fff;
                --skeleton-bg: #1a1a1a;
                --overlay-bg: rgba(0, 0, 0, 0.85);
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; background: var(--bg-panel); color: var(--text-main); font-family: var(--f-sans); }
        body { min-height: 100dvh; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
        body.is-locked { position: fixed; width: 100%; overflow: hidden; }

        /* [LOCK] ======================================================
           COMPONENT: APP-HEADER
           ============================================================= */
        .app-header { position: fixed; top: 0; left: 0; right: 0; z-index: 9999; mix-blend-mode: difference; pointer-events: none; }
        .app-header__nav { padding: calc(env(safe-area-inset-top) + var(--grid-gap)) var(--grid-gap) 0 var(--grid-gap); display: flex; justify-content: space-between; align-items: center; }
        .app-header__logo-zone, .app-header__links-zone { pointer-events: auto; display: flex; align-items: center; height: var(--nav-h); }
        .app-header__link { color: var(--text-inv) !important; text-decoration: none; font-weight: var(--nav-weight); white-space: nowrap; display: flex; align-items: center; cursor: pointer; }
        .app-header__pc-links { display: none; }
        .app-header__dropdown { position: absolute; top: 100%; left: 0; display: none; flex-direction: column; width: max-content; }
        .app-header__item--has-sub:hover .app-header__dropdown { display: flex; }
        .app-header__menu-btn { background: none; border: none; cursor: pointer; width: 24px; height: var(--nav-h); position: relative; display: flex; align-items: center; justify-content: flex-end; }
        .app-header__menu-btn span { display: block; width: 24px; height: 1.5px; background: #fff; position: absolute; transition: all 0.4s var(--ease-in-out); }
        .app-header__menu-btn--line1 { transform: translateY(-4px); }
        .app-header__menu-btn--line2 { transform: translateY(4px); }
        .app-header__menu-btn.is-active .app-header__menu-btn--line1 { transform: translateY(0) rotate(45deg); }
        .app-header__menu-btn.is-active .app-header__menu-btn--line2 { transform: translateY(0) rotate(-45deg); }

        @media (min-width: 768px) {
            .app-header__pc-links { display: flex; gap: 30px; height: 100%; }
            .app-header__menu-btn { display: none !important; }
            .app-header__item--has-sub { position: relative; height: 100%; display: flex; align-items: center; }
            .app-header__link:hover::before { content: ''; position: fixed; left: 0; right: 0; height: 1.2em; background: #fff; z-index: -1; pointer-events: none; top: calc(var(--grid-gap) + (var(--nav-h)/2) + env(safe-area-inset-top)); transform: translateY(-50%); }
            .app-header__dropdown .app-header__link:hover::before { top: auto; transform: translateY(-5%); }
            .app-header__link:hover { color: #000 !important; }
        }

        /* [LOCK] ======================================================
           COMPONENT: MOBILE-OVERLAY
           ============================================================= */
        .mobile-overlay { position: fixed; inset: 0; z-index: 9000; visibility: hidden; opacity: 0; transition: 0.4s var(--ease-in-out); }
        .mobile-overlay.is-active { visibility: visible; opacity: 1; }
        .mobile-overlay__bg { position: absolute; top: -20vh; left: 0; width: 100vw; height: 140vh; background: var(--overlay-bg); backdrop-filter: blur(var(--overlay-blur)); -webkit-backdrop-filter: blur(var(--overlay-blur)); }
        .mobile-overlay__content { position: absolute; inset: 0; mix-blend-mode: difference; padding: calc(80px + env(safe-area-inset-top)) var(--grid-gap) calc(40px + env(safe-area-inset-bottom)); overflow-y: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
        .mobile-overlay__content::-webkit-scrollbar { display: none; }
        .mobile-overlay__group { border-bottom: 0.5px solid rgba(255,255,255,0.15); margin-bottom: 15px; padding-bottom: 12px; }
        .mobile-overlay__main-link { display: flex; justify-content: space-between; align-items: center; font-size: 20px; font-weight: 700; color: #fff; text-decoration: none; padding: 5px 0; }
        .mobile-overlay__sub-links { display: none; flex-direction: column; padding-top: 10px; }
        .mobile-overlay__sub-links.is-open { display: flex; }
        .mobile-overlay__sub-links a { margin: 8px 0; font-size: 18px; color: #fff; text-decoration: none; opacity: 0.8; }
        .mobile-overlay__icon { font-size: 22px; transition: transform 0.3s var(--ease-in-out); display: inline-block; }
        .mobile-overlay__group.is-expanded .mobile-overlay__icon { transform: rotate(45deg); }

        /* [EDITABLE] ==================================================
           COMPONENT: GALLERY-SYSTEM (Core Layout)
           ============================================================= */
        .gallery-system { width: 100%; display: grid; grid-template-columns: repeat(12, 1fr); gap: var(--grid-gap); }
        .gallery-system__left { grid-column: span 12; }
        .gallery-system__track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; -ms-overflow-style: none; }
        .gallery-system__track::-webkit-scrollbar { display: none; }
        .gallery-system__slide { min-width: 100%; scroll-snap-align: start; }
        .gallery-system__right { grid-column: span 12; padding-top: 20px; }
        .gallery-system__pipeline { display: flex; flex-direction: column; }

        @media (min-width: 768px) {
            .gallery-system { height: 100vh; overflow: hidden; }
            .gallery-system__left { grid-column: span 7; height: 100%; overflow: hidden; position: relative; }
            .gallery-system__track { flex-direction: column; height: 100%; overflow-y: auto; scroll-snap-type: none; gap: var(--grid-gap); }
            .gallery-system__track::-webkit-scrollbar { display: none; }
            .gallery-system__slide { min-width: 100%; }
            .gallery-system__right { grid-column: span 5; height: 100%; overflow-y: auto; scrollbar-width: none; }
            .gallery-system__right::-webkit-scrollbar { display: none; }
            .gallery-system__pipeline { padding: calc(var(--nav-h) + var(--grid-gap) + 40px + env(safe-area-inset-top)) 0 0 0; }
        }

        /* [RESTRUCTURED v3.75] =========================================
           COMPONENT: MEDIA-ENGINE (Alpha Fix & LQIP Optimize)
           ============================================================= */
        .media-engine { 
            position: relative; 
            width: 100%; 
            /* 1. 占位方案：注入 --main-color 或回退至 skeleton-bg */
            background-color: var(--main-color, var(--skeleton-bg));
            overflow: hidden; 
            line-height: 0; 
            /* 3. 动画同步：背景色切换时长设为 0.4s */
            transition: background-color 0.4s var(--ease-in-out);
        }
        
        /* 核心修复：加载完成后强制抽离背景色，确保透明 PNG 不透出底色 */
        .media-engine.is-content-ready {
            background-color: transparent !important;
        }

        .media-engine__item { 
            width: 100%; 
            height: auto; 
            display: block; 
            opacity: 0; 
            /* 3. 动画同步：渐现时长同步为 0.4s */
            transition: opacity 0.4s var(--ease-in-out); 
            will-change: opacity;
        }
        .media-engine__item.is-loaded { 
            opacity: 1; 
        }

        .media-engine__shield { position: absolute; inset: 0; z-index: 5; background: transparent; }
        .media-engine--gallery img { aspect-ratio: 4/5; object-fit: cover; }
        @media (min-width: 768px) { .media-engine--gallery img { aspect-ratio: auto; min-height: 100%; } }
        .ui-text-block { margin: 0 var(--grid-gap) 20px var(--grid-gap); line-height: 1.8; }
        .ui-media-block { margin-bottom: var(--grid-gap); width: 100%; }
    </style>
</head>
<body oncontextmenu="return false;" ondragstart="return false;">

    <!-- [LOCK] APP-HEADER -->
    <header class="app-header" id="appHeader">
        <nav class="app-header__nav">
            <div class="app-header__logo-zone" id="logoZone"></div>
            <div class="app-header__links-zone">
                <div class="app-header__pc-links" id="pcNavLinks"></div>
                <button class="app-header__menu-btn" id="menuToggle" aria-label="Toggle Menu">
                    <span class="app-header__menu-btn--line1"></span>
                    <span class="app-header__menu-btn--line2"></span>
                </button>
            </div>
        </nav>
    </header>

    <!-- [LOCK] MOBILE-OVERLAY -->
    <div class="mobile-overlay" id="mobileOverlay">
        <div class="mobile-overlay__bg" id="overlayBg"></div>
        <div class="mobile-overlay__content" id="overlayContent"></div>
    </div>

    <!-- [EDITABLE] MAIN-GALLERY -->
    <main class="gallery-system">
        <section class="gallery-system__left">
            <div class="gallery-system__track" id="leftTrack"></div>
        </section>
        <aside class="gallery-system__right">
            <div class="gallery-system__pipeline" id="rightPipeline"></div>
        </aside>
    </main>

    <script>
        /* [LOCK] ======================================================
           GLOBAL CONFIG & INIT LOGIC
           ============================================================= */
        const GLOBAL_CONFIG = {
            site: {
                title: "ApparEdit™ - NeuePoor",
                favicon: "https://cdn.neuepoor.com/apparedit/template/favicon.webp",
                placeholder: "https://via.placeholder.com/800x1000?text=Loading..."
            },
            navigation: {
                logo: { text: "PoorLegalGuy®", url: "https://home.neuepoor.com/", size: "18px" },
                items: [
                    { 
                        name: "Category", 
                        url: "#", 
                        children: [
                            { name: "Apparedit", url: "https://apparedit.neuepoor.com/" },
                            { name: "Inspo", url: "#" },
                            { name: "Tone", url: "#" },
                            { name: "Raw", url: "#" },
                            { name: "Lab", url: "#" }
                        ]
                    },
                    { 
                        name: "ApparEdit", 
                        url: "#", 
                        children: [
                            { name: "Archive", url: "#" }
                        ]
                    }
                ]
            },
            content: {
                leftGallery: [
                    { url: 'https://cdn.neuepoor.com/apparedit/template/001.webp' },
                    { url: 'https://cdn.neuepoor.com/apparedit/template/002.webp' },
                    { url: 'https://cdn.neuepoor.com/apparedit/template/003.jpg' }
                ],
                rightPipeline: [
                    { 
                        type: 'text', 
                        title: "MediaEngine v3.75™", 
                        titleSize: "18px",
                        descSize: "10px",
                        body: "根据“第一性原则”完成重构：1. 引入状态机监听，加载完成后同步释放背景色（background-color: transparent），完美适配透明 PNG。2. 异步 Canvas 1x1 采样模拟 Cloudflare LQIP 占位感。3. 0.4s 动效对焦过渡，严禁 Reflow。"
                    },
                    { type: 'media', url: 'https://cdn.neuepoor.com/apparedit/template/004.jpg' },
                    { type: 'media', url: 'https://cdn.neuepoor.com/apparedit/template/005.jpg' },
                    { type: 'media', url: 'https://cdn.neuepoor.com/apparedit/template/006.jpg' }
                ]
            }
        };

        /* [RESTRUCTURED v3.75] MediaEngine: Async 1x1 Extraction & State Machine */
        const MediaEngine = {
            // 基于指令 2: 1x1 像素采样方案
            extractMainColor: async (url, container) => {
                if (!url || /\.(mp4|webm|mov)$/i.test(url)) return;

                try {
                    const img = new Image();
                    img.crossOrigin = "Anonymous";
                    // 模拟 Cloudflare Workers 接口请求 1x1 缩略图
                    // 实际应用可替换为 `${url}?width=1&height=1`
                    img.src = url;

                    await new Promise((resolve, reject) => {
                        img.onload = resolve;
                        img.onerror = reject;
                    });

                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d', { alpha: false }); // 优化性能，不处理透明度
                    canvas.width = 1;
                    canvas.height = 1;
                    ctx.drawImage(img, 0, 0, 1, 1);
                    const [r, g, b] = ctx.getImageData(0, 0, 1, 1).data;
                    
                    // 变量注入
                    container.style.setProperty('--main-color', `rgb(${r}, ${g}, ${b})`);
                } catch (e) {
                    // 视觉降级：取色失败回退到 var(--skeleton-bg)
                }
            },

            render: (url, className = '') => {
                const isVideo = /\.(mp4|webm|mov)$/i.test(url);
                const engineId = `me-${Math.random().toString(36).substr(2, 9)}`;
                
                const html = isVideo 
                    ? `<video class="media-engine__item" src="${url}" muted loop playsinline autoplay preload="metadata"></video>`
                    : `<img class="media-engine__item" src="${url}" loading="lazy" decoding="async">`;
                
                // 性能准则：取色逻辑全部异步处理，不得阻塞滑动帧率
                if (!isVideo) {
                    requestAnimationFrame(() => {
                        setTimeout(() => {
                            const container = document.getElementById(engineId);
                            if (container) MediaEngine.extractMainColor(url, container);
                        }, 50);
                    });
                }

                return `
                    <div class="media-engine ${className}" id="${engineId}">
                        <div class="media-engine__shield"></div>
                        ${html}
                    </div>
                `;
            },

            init: () => {
                // 基于指令 1: 背景自动化释放逻辑
                document.body.addEventListener('load', (e) => {
                    if (e.target.classList.contains('media-engine__item')) {
                        const item = e.target;
                        const container = item.closest('.media-engine');
                        
                        // 动画同步：触发 .is-loaded
                        item.classList.add('is-loaded');
                        
                        // 状态机监听：同步添加 .is-content-ready 类以抽离背景
                        if (container) {
                            container.classList.add('is-content-ready');
                        }
                    }
                }, true);
            }
        };

        /* [LOCK] APP-HEADER Logic */
        const AppHeader = {
            init: () => {
                const btn = document.getElementById('menuToggle');
                const overlay = document.getElementById('mobileOverlay');
                const bg = document.getElementById('overlayBg');
                const toggle = () => {
                    const isOpen = btn.classList.toggle('is-active');
                    overlay.classList.toggle('is-active', isOpen);
                    if (isOpen) {
                        const scrollY = window.scrollY;
                        document.body.style.top = `-${scrollY}px`;
                        document.body.classList.add('is-locked');
                    } else {
                        const scrollY = parseInt(document.body.style.top || '0') * -1;
                        document.body.classList.remove('is-locked');
                        document.body.style.top = '';
                        window.scrollTo(0, scrollY);
                    }
                };
                btn.addEventListener('click', toggle);
                bg.addEventListener('click', toggle);
            }
        };

        /* [LOCK] Rendering Engine */
        function renderUI() {
            document.title = GLOBAL_CONFIG.site.title;
            const fav = document.getElementById('ui-favicon');
            if(fav) fav.href = GLOBAL_CONFIG.site.favicon;

            document.getElementById('logoZone').innerHTML = `<a href="${GLOBAL_CONFIG.navigation.logo.url}" class="app-header__link" style="font-size: ${GLOBAL_CONFIG.navigation.logo.size}">${GLOBAL_CONFIG.navigation.logo.text}</a>`;

            const pcNav = document.getElementById('pcNavLinks');
            pcNav.innerHTML = GLOBAL_CONFIG.navigation.items.map(item => `
                <div class="app-header__item ${item.children ? 'app-header__item--has-sub' : ''}">
                    <a href="${item.url}" class="app-header__link">${item.name}</a>
                    ${item.children ? `<div class="app-header__dropdown">${item.children.map(child => `<a href="${child.url}" class="app-header__link">${child.name}</a>`).join('')}</div>` : ''}
                </div>
            `).join('');

            const mobileContent = document.getElementById('overlayContent');
            mobileContent.innerHTML = GLOBAL_CONFIG.navigation.items.map((item, idx) => `
                <div class="mobile-overlay__group" id="group-${idx}">
                    <a href="${item.children ? 'javascript:void(0)' : item.url}" class="mobile-overlay__main-link" data-idx="${idx}">
                        <span>${item.name}</span>
                        ${item.children ? `<span class="mobile-overlay__icon">+</span>` : ''}
                    </a>
                    ${item.children ? `<div class="mobile-overlay__sub-links" id="sub-${idx}">${item.children.map(child => `<a href="${child.url}">${child.name}</a>`).join('')}</div>` : ''}
                </div>
            `).join('');

            mobileContent.addEventListener('click', (e) => {
                const link = e.target.closest('.mobile-overlay__main-link');
                if (link && link.dataset.idx) {
                    const idx = link.dataset.idx;
                    const group = document.getElementById(`group-${idx}`);
                    const sub = document.getElementById(`sub-${idx}`);
                    if (sub) { group.classList.toggle('is-expanded'); sub.classList.toggle('is-open'); }
                }
            });

            document.getElementById('leftTrack').innerHTML = GLOBAL_CONFIG.content.leftGallery.map(item => `
                <div class="gallery-system__slide">${MediaEngine.render(item.url, 'media-engine--gallery')}</div>
            `).join('');

            const rightRoot = document.getElementById('rightPipeline');
            rightRoot.innerHTML = GLOBAL_CONFIG.content.rightPipeline.map(item => {
                if (item.type === 'text') return `<div class="ui-text-block"><h1 style="font-size: ${item.titleSize}">${item.title}</h1><p style="font-size: ${item.descSize}">${item.body}</p></div>`;
                if (item.type === 'media') return `<div class="ui-media-block">${MediaEngine.render(item.url)}</div>`;
                return '';
            }).join('');
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderUI();
            MediaEngine.init();
            AppHeader.init();
        });
    </script>
</body>
</html>
