<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff" id="theme-meta">
    <title id="ui-title">Loading...</title>
    <link rel="icon" id="ui-favicon" type="image/webp" href="">

    <style>
        /* =============================================================
           [GLOBAL VARIABLES]
           ============================================================= */
        :root {
            --bg-panel: #fff; 
            --text: #000; 
            --nav-h: 32px; 
            --grid-gap: 4px; 
            --f-fallback: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --nav-diff-color: #ffffff; 
            --ease: cubic-bezier(0.23, 1, 0.32, 1); 
            --nav-weight: 700;
            --skeleton-bg: #f0f0f0; 
        }
        @media (prefers-color-scheme: dark) { 
            :root { --bg-panel: #000; --text: #fff; --skeleton-bg: #1a1a1a; } 
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-touch-callout: none; }
        
        html, body { background: var(--bg-panel); width: 100%; }
        body { font-family: var(--f-fallback); color: var(--text); overflow-x: hidden; min-height: 100dvh; }

        /* 锁定背景：解决 iOS 滚动穿透 */
        .lock-scroll { overflow: hidden !important; height: 100% !important; position: fixed !important; width: 100% !important; }

        /* =============================================================
           [NAVBAR]
           ============================================================= */
        .nav-wrapper { position: fixed; top: 0; left: 0; right: 0; z-index: 9999; mix-blend-mode: difference; pointer-events: none; }
        .nav { padding: calc(env(safe-area-inset-top) + var(--grid-gap)) var(--grid-gap) 0 var(--grid-gap); display: flex; justify-content: space-between; align-items: center; }
        .nav-logo-zone, .nav-links-zone { pointer-events: auto; display: flex; align-items: center; height: var(--nav-h); }
        .nav a, .sub-nav-bar a { color: var(--nav-diff-color) !important; text-decoration: none; font-weight: var(--nav-weight); display: flex; align-items: center; white-space: nowrap; }
        
        .sub-nav-bar { position: absolute; top: 100%; left: 0; display: none; flex-direction: column; pointer-events: auto; width: fit-content; }
        .nav-links-pc > div:hover .sub-nav-bar { display: flex; }
        .nav-links-pc { display: none; } 

        .menu-btn { background: none; border: none; cursor: pointer; width: 24px; height: var(--nav-h); position: relative; display: flex; align-items: center; justify-content: flex-end; }
        .menu-btn span { display: block; width: 24px; height: 1.5px; background: #fff; position: absolute; transition: all 0.4s var(--ease); }
        .line-1 { transform: translateY(-4px); } .line-2 { transform: translateY(4px); }
        .menu-btn.active .line-1 { transform: translateY(0) rotate(45deg); }
        .menu-btn.active .line-2 { transform: translateY(0) rotate(-45deg); }

        @media (min-width: 768px) {
            .nav-links-pc { display: flex; gap: 30px; height: 100%; position: relative; }
            .menu-btn { display: none !important; }
            .has-sub { height: 100%; display: flex; align-items: center; position: relative; }
            .nav a:hover::before, .sub-nav-bar a:hover::before { content: ''; position: fixed; left: 0; right: 0; height: 1.2em; background: #fff; z-index: -1; pointer-events: none; }
            .nav a:hover::before { top: calc(var(--grid-gap) + (var(--nav-h)/2) + env(safe-area-inset-top)); transform: translateY(-50%); }
            .sub-nav-bar a:hover::before { top: auto; transform: translateY(-5%); height: 1.2em; }
            .nav a:hover, .sub-nav-bar a:hover { color: #000 !important; }
            .sub-nav-bar a { height: var(--nav-h); padding: 0; }
        }

        /* =============================================================
           [MEDIA ENGINE]
           ============================================================= */
        .media-container { position: relative; width: 100%; background: var(--skeleton-bg); overflow: hidden; line-height: 0; transition: background 0.3s ease; }
        .media-container.is-loaded { background: transparent; }
        .media-shield { position: absolute; inset: 0; z-index: 5; background: transparent; cursor: default; }
        .media-item { width: 100%; height: auto; display: block; transition: opacity 0.6s var(--ease); opacity: 0; }
        .media-item.loaded { opacity: 1; }

        /* =============================================================
           [LAYOUT]
           ============================================================= */
        .main { width: 100%; display: grid; grid-template-columns: repeat(12, 1fr); gap: var(--grid-gap); }
        @media (min-width: 768px) {
            .main { height: 100vh; overflow: hidden; }
            .left-panel { grid-column: span 7; height: 100%; overflow: hidden; position: relative; }
            .right-panel { grid-column: span 5; height: 100%; overflow-y: auto; }
        }
        @media (max-width: 767px) { .left-panel, .right-panel { grid-column: span 12; } .main { display: block; height: auto; } }

        .gallery-track { display: flex; width: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
        .gallery-item { min-width: 100%; scroll-snap-align: start; }
        .gallery-item .media-container img { aspect-ratio: 4 / 5; object-fit: cover; }

        @media (min-width: 768px) {
            .gallery-track { flex-direction: column; height: 100%; overflow-y: auto; scroll-snap-type: none; gap: var(--grid-gap); }
            .gallery-item .media-container img { height: auto; min-height: 100%; aspect-ratio: auto; }
        }

        .right-inner { padding: calc(var(--nav-h) + var(--grid-gap) + 40px + env(safe-area-inset-top)) 0 0 0; display: flex; flex-direction: column; }
        .rich-text { line-height: 1.8; margin: 0 var(--grid-gap) 20px var(--grid-gap); }
        .media-box { width: 100%; margin-bottom: var(--grid-gap); line-height: 0; }

        /* =============================================================
           [OVERLAY MODAL]
           ============================================================= */
        .overlay-bg { 
            position: fixed; top: -20vh; left: 0; width: 100vw; height: 140vh; z-index: 9000; 
            opacity: 0; visibility: hidden; transition: 0.4s var(--ease); 
            background: rgba(255, 255, 255, 0.4); 
            backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
        }
        .overlay-content { 
            position: fixed; inset: 0; z-index: 9001; 
            display: flex; flex-direction: column; 
            padding: calc(80px + env(safe-area-inset-top)) var(--grid-gap) calc(env(safe-area-inset-bottom) + 40px) var(--grid-gap); 
            opacity: 0; visibility: hidden; 
            mix-blend-mode: difference; /* 保持与导航栏一致的反色逻辑 */
            overflow-y: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
        }
        .overlay-bg.active, .overlay-content.active { opacity: 1; visibility: visible; }
        
        /* 响应式断点：在大屏下强制关闭手机菜单 UI */
        @media (min-width: 768px) {
            .overlay-bg, .overlay-content { display: none !important; }
        }

        .mobile-link-group { margin: 15px 0; border-bottom: 0.5px solid rgba(255,255,255,0.2); padding-bottom: 12px; width: 100%; }
        .mobile-main-link { display: flex; justify-content: space-between; align-items: center; font-size: 20px; font-weight: 700; color: #fff; text-decoration: none; }
        .mobile-sub-links { display: none; flex-direction: column; padding: 10px 0 0 0; }
        .mobile-sub-links.active { display: flex; }
        .mobile-sub-links a { margin: 10px 0; font-size: 18px; color: #fff; text-decoration: none; }
        .plus-icon { font-size: 24px; transition: transform 0.3s; }
        .expanded .plus-icon { transform: rotate(45deg); }
    </style>
</head>
<body oncontextmenu="return false;" ondragstart="return false;">

    <div class="nav-wrapper" id="ui-nav-wrapper">
        <nav class="nav">
            <div class="nav-logo-zone" id="ui-nav-logo"></div>
            <div class="nav-links-zone">
                <div class="nav-links-pc" id="ui-nav-pc"></div>
                <button class="menu-btn" id="menuBtn" onclick="toggleMenu()" aria-label="Menu">
                    <span class="line-1"></span><span class="line-2"></span>
                </button>
            </div>
        </nav>
    </div>

    <div class="overlay-bg" id="mobileMenuBg" onclick="toggleMenu()"></div>
    <div class="overlay-content" id="mobileMenuContent"></div>

    <main class="main">
        <section class="left-panel">
            <div class="gallery-track" id="ui-left-track"></div>
        </section>
        <aside class="right-panel">
            <div class="right-inner" id="ui-right-root"></div>
        </aside>
    </main>

    <script>
        const CONFIG = {
            site: { 
                pageTitle: "ApparEdit™ - NeuePoor", 
                favicon: "https://cdn.neuepoor.com/apparedit/template/favicon.webp",
                placeholder: "https://via.placeholder.com/800x1000?text=Asset+Unavailable" 
            },
            navbar: {
                logo: { text: "PoorLegalGuy®", fontSize: "18px", link: "https://home.neuepoor.com/" },
                links: [
                    { 
                        name: "Category", 
                        url: "#", 
                        fontSize: "18px",
                        children: [
                            { name: "Apparedit", url: "https://apparedit.neuepoor.com/" },
                            { name: "inspo", url: "#" },
                            { name: "Tone", url: "#" },
                            { name: "Raw", url: "#" },
                            { name: "Lab", url: "#" }
                        ]
                    },
                    { 
                        name: "ApparEdit", 
                        url: "#", 
                        fontSize: "18px",
                        children: [
                            { name: "Archive", url: "#" }
                        ]
                    }
                ]
            },
            gallery: {
                leftMedia: [
                    { url: 'https://cdn.neuepoor.com/apparedit/template/001.webp' },
                    { url: 'https://cdn.neuepoor.com/apparedit/template/002.webp' },
                    { url: 'https://cdn.neuepoor.com/apparedit/template/003.jpg' }
                ],
                rightSidebar: [
                    { 
                        type: 'text', 
                        title: "2603001™", 
                        titleSize: "18px",
                        bodyTextSize: "10px",
                        description: "已修复：v3.65 恢复了模糊透明样式与 mix-blend-mode。解决了 PC 端拉伸时的重叠问题。菜单开启时背景完全锁定，状态栏视觉效果已根据 iOS 26 环境优化。"
                    },
                    { type: 'media', url: 'https://cdn.neuepoor.com/apparedit/template/004.jpg' },
                    { type: 'media', url: 'https://cdn.neuepoor.com/apparedit/template/005.jpg' },
                    { type: 'media', url: 'https://cdn.neuepoor.com/apparedit/template/006.jpg' }
                ]
            }
        };

        function handleMediaLoad(el) {
            el.classList.add('loaded');
            const container = el.closest('.media-container');
            if (container) container.classList.add('is-loaded');
        }

        function renderMedia(url) {
            const ext = url.split('.').pop().toLowerCase();
            const isVideo = ['mp4', 'webm', 'mov'].includes(ext);
            let mediaHtml = isVideo 
                ? `<video class="media-item" src="${url}" muted loop playsinline autoplay preload="metadata" oncanplay="handleMediaLoad(this)"></video>`
                : `<img class="media-item" src="${url}" loading="lazy" decoding="async" draggable="false" onload="handleMediaLoad(this)" onerror="this.src='${CONFIG.site.placeholder}'; handleMediaLoad(this)">`;
            return `<div class="media-container"><div class="media-shield"></div>${mediaHtml}</div>`;
        }

        function toggleMenu() {
            const bg = document.getElementById('mobileMenuBg');
            const content = document.getElementById('mobileMenuContent');
            const btn = document.getElementById('menuBtn');
            const meta = document.getElementById('theme-meta');
            const html = document.documentElement;
            const body = document.body;

            const isOpen = bg.classList.toggle('active');
            content.classList.toggle('active');
            btn.classList.toggle('active');

            // 动态 Theme Color，适应白色模糊背景下的电量图标
            meta.setAttribute('content', isOpen ? "#efefef" : "#ffffff");

            if (isOpen) {
                const scrollY = window.scrollY;
                body.dataset.scrollY = scrollY;
                body.style.top = `-${scrollY}px`;
                html.classList.add('lock-scroll');
                body.classList.add('lock-scroll');
            } else {
                const scrollY = parseInt(body.dataset.scrollY || '0');
                html.classList.remove('lock-scroll');
                body.classList.remove('lock-scroll');
                body.style.top = '';
                window.scrollTo(0, scrollY);
            }
        }

        function toggleSubMenu(index) {
            const group = document.getElementById(`m-group-${index}`);
            const sub = document.getElementById(`m-sub-${index}`);
            group.classList.toggle('expanded');
            sub.classList.toggle('active');
        }

        function init() {
            document.title = CONFIG.site.pageTitle;
            const fav = document.getElementById('ui-favicon');
            if(fav) fav.href = CONFIG.site.favicon;

            document.getElementById('ui-nav-logo').innerHTML = `<a href="${CONFIG.navbar.logo.link}" style="font-size: ${CONFIG.navbar.logo.fontSize}">${CONFIG.navbar.logo.text}</a>`;
            
            document.getElementById('ui-nav-pc').innerHTML = CONFIG.navbar.links.map(link => `
                <div class="${link.children ? 'has-sub' : ''}">
                    <a href="${link.url}" style="font-size: ${link.fontSize}">${link.name}</a>
                    ${link.children ? `<div class="sub-nav-bar">${link.children.map(c => `<a href="${c.url}" style="font-size: ${link.fontSize}">${c.name}</a>`).join('')}</div>` : ''}
                </div>
            `).join('');
            
            document.getElementById('mobileMenuContent').innerHTML = CONFIG.navbar.links.map((link, idx) => `
                <div class="mobile-link-group" id="m-group-${idx}">
                    <a href="${link.children ? 'javascript:void(0)' : link.url}" class="mobile-main-link" onclick="${link.children ? `toggleSubMenu(${idx})` : 'toggleMenu()'}">
                        <span>${link.name}</span>
                        ${link.children ? `<span class="plus-icon">+</span>` : ''}
                    </a>
                    ${link.children ? `<div class="mobile-sub-links" id="m-sub-${idx}">${link.children.map(c => `<a href="${c.url}" onclick="toggleMenu()">${c.name}</a>`).join('')}</div>` : ''}
                </div>
            `).join('');

            document.getElementById('ui-left-track').innerHTML = CONFIG.gallery.leftMedia.map(m => `<div class="gallery-item">${renderMedia(m.url)}</div>`).join('');

            const rightContainer = document.getElementById('ui-right-root');
            rightContainer.innerHTML = CONFIG.gallery.rightSidebar.map(item => {
                if (item.type === 'text') {
                    return `<div class="rich-text"><h1 style="font-size: ${item.titleSize}">${item.title}</h1><p style="font-size: ${item.bodyTextSize}">${item.description}</p></div>`;
                } else if (item.type === 'media') {
                    return `<div class="media-box">${renderMedia(item.url)}</div>`;
                }
                return '';
            }).join('');
        }

        window.onload = init;
    </script>
</body>
</html>
