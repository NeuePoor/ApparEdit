<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ApparEdit™ - PoorLegalGuy®</title>
    <link rel="icon" type="image/webp" href="https://cdn.neuepoor.com/Favicon.webp">

    <style>
        :root {
            --bg: #fff; --text: #000; --border: #efefef;
            --nav-h: 44px; --gap: 2px; --safe: 15px;
            --f-main: "Arial", sans-serif;
            /* 差值模式下的文字基础色：必须为白色才能在白色背景上反转为黑色 */
            --nav-diff-color: #ffffff; 
        }

        @media (prefers-color-scheme: dark) {
            :root { --bg: #000; --text: #fff; --border: #111; }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--f-main); background: var(--bg); color: var(--text);
            overflow-x: hidden; -webkit-font-smoothing: antialiased;
        }

        /* Navbar: 差值模式重设计 */
        .nav {
            position: fixed; top: 0; width: 100%; height: var(--nav-h);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 var(--safe); z-index: 2000;
            
            /* 核心修改：去掉背景，启用差值混合 */
            background: transparent; 
            mix-blend-mode: difference;
            pointer-events: none; /* 穿透容器本身 */
        }

        .nav a, .menu-btn {
            pointer-events: auto; /* 仅链接和按钮响应点击 */
            color: var(--nav-diff-color) !important;
            text-decoration: none;
            transition: opacity 0.2s ease;
        }

        .logo { font-size: 18px; letter-spacing: -0.5px; font-weight: 700; }
        .nav-links { display: none; gap: 20px; }
        .nav-links a { font-weight: 600; font-size: 13px; }
        
        @media (min-width: 768px) { .nav-links { display: flex; } }

        /* Layout Engine */
        .main { display: flex; flex-direction: column; }
        @media (min-width: 768px) {
            .main { flex-direction: row; height: 100vh; overflow: hidden; }
        }

        /* Gallery */
        .gallery { flex: 1.6; position: relative; background: var(--bg); }
        .gallery-track {
            display: flex; width: 100%; overflow-x: auto; scroll-snap-type: x mandatory;
            scrollbar-width: none; -ms-overflow-style: none;
        }
        .gallery-track::-webkit-scrollbar { display: none; }
        .gallery-item { min-width: 100%; scroll-snap-align: start; }
        .gallery-item img { width: 100%; height: auto; display: block; object-fit: cover; background: var(--border); min-height: 100vh; }

        @media (min-width: 768px) {
            .gallery-track { flex-direction: column; height: 100%; overflow-y: auto; scroll-snap-type: none; gap: var(--gap); }
            .gallery-item img { min-height: 100vh; }
        }

        /* Sidebar */
        .sidebar { flex: 1; border-left: var(--gap) solid var(--border); background: var(--bg); overflow-y: auto; }
        .sidebar-inner { padding: 80px var(--safe) 100px; } /* 增加顶部 padding 避免文字重叠 */
        .rich-text { font-size: 11px; line-height: 1.8; }
        .rich-text h1 { font-size: 20px; margin-bottom: 20px; font-weight: 700; }
        .rich-text p { margin-bottom: 15px; opacity: 0.9; }
        .media-box { width: 100%; margin: 10px 0 20px; background: var(--border); }
        .media-box img { width: 100%; height: auto; display: block; }

        /* Mobile Menu */
        .menu-btn { background: none; border: none; cursor: pointer; display: block; padding: 5px; }
        .menu-btn span { display: block; width: 20px; height: 1.5px; background: var(--nav-diff-color); margin: 4px 0; }
        @media (min-width: 768px) { .menu-btn { display: none; } }
        
        .overlay {
            position: fixed; inset: 0; background: var(--bg); z-index: 1500;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transform: translateY(-100%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .overlay.active { transform: translateY(0); }
        .overlay a { font-size: 24px; margin: 15px; font-weight: 700; color: var(--text) !important; text-decoration: none; }
    </style>
</head>
<body>

    <nav class="nav">
        <a href="https://home.neuepoor.com/" class="logo">PoorLegalGuy®</a>
        <div class="nav-links">
            <a href="https://home.neuepoor.com">Category</a>
            <a href="https://apparedit.neuepoor.com/">ApparEdit</a>
            <a href="#" style="opacity: 0.3">PDP</a>
        </div>
        <button class="menu-btn" onclick="toggleMenu()"><span></span><span></span></button>
    </nav>

    <div class="overlay" id="mobileMenu">
        <a href="https://home.neuepoor.com" onclick="toggleMenu()">Category</a>
        <a href="https://apparedit.neuepoor.com/" onclick="toggleMenu()">ApparEdit</a>
        <a href="#" onclick="toggleMenu()">PDP</a>
    </div>

    <main class="main">
        <section class="gallery">
            <div class="gallery-track" id="gallery"></div>
        </section>

        <aside class="sidebar">
            <div class="sidebar-inner" id="sidebar"></div>
        </aside>
    </main>

    <script>
        const TARGET_IMG = "https://cdn.neuepoor.com/apparedit/bg1%20%282%29.webp";

        const APP_DATA = {
            gallery: Array(14).fill(TARGET_IMG),
            sidebarTitle: "ApparEdit™",
            sidebarBlocks: [
                { t: "p", v: "测试一下的选项，if this support poorlegalguy." },
                { t: "img", v: TARGET_IMG },
                { t: "p", v: "这不仅仅是一个编辑器，它代表了我们对内容创作边界的重新思考。" },
                { t: "img", v: TARGET_IMG },
                { t: "img", v: TARGET_IMG },
                { t: "p", v: "在 ADS 设计系统下，我们确保跨平台的视觉一致性。" },
                { t: "img", v: TARGET_IMG },
                { t: "p", v: "感谢您选择 PoorLegalGuy® 的设计服务。我们将持续为您迭代。" }
            ]
        };

        function toggleMenu() {
            const menu = document.getElementById('mobileMenu');
            menu.classList.toggle('active');
            document.body.style.overflow = menu.classList.contains('active') ? 'hidden' : '';
        }

        function init() {
            // 渲染画廊
            document.getElementById('gallery').innerHTML = APP_DATA.gallery.map(src => `
                <div class="gallery-item"><img src="${src}" onerror="this.src='https://placehold.co/800x1200?text=Image+Error'"></div>
            `).join('');

            // 渲染侧边栏
            const sidebarHtml = `
                <div class="rich-text">
                    <h1>${APP_DATA.sidebarTitle}</h1>
                    ${APP_DATA.sidebarBlocks.map(b => 
                        b.t === 'p' ? `<p>${b.v}</p>` : `</div><div class="media-box"><img src="${b.v}"></div><div class="rich-text">`
                    ).join('')}
                </div>
            `;
            document.getElementById('sidebar').innerHTML = sidebarHtml;
        }

        window.onload = init;
    </script>
</body>
</html>
