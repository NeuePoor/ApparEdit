<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff" id="theme-meta">
    <title>Loading...</title>
    <link rel="icon" id="ui-favicon" type="image/webp" href="">

    <style>
        /* =============================================================
           [1. DESIGN TOKENS] - 核心设计变量
           ============================================================= */
        :root {
            --bg-panel: #fff;
            --text-main: #000;
            --text-inv: #fff;
            --nav-h: 32px;
            --grid-gap: 4px;
            --f-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --ease-in-out: cubic-bezier(0.23, 1, 0.32, 1);
            --skeleton-bg: #f0f0f0;
            --nav-weight: 700;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-panel: #000;
                --text-main: #fff;
                --skeleton-bg: #1a1a1a;
            }
        }

        /* 基础重置 */
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; background: var(--bg-panel); color: var(--text-main); font-family: var(--f-sans); }
        body { min-height: 100dvh; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
        
        /* 针对 iOS 的滚动锁定辅助类 */
        body.is-locked { position: fixed; width: 100%; overflow: hidden; }

        /* =============================================================
           [2. APP-HEADER] - 导航组件 (BEM: .app-header)
           ============================================================= */
        .app-header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
            mix-blend-mode: difference;
            pointer-events: none;
            transition: transform 0.4s var(--ease-in-out);
        }
        
        /* 导航内层容器 */
        .app-header__nav {
            padding: calc(env(safe-area-inset-top) + var(--grid-gap)) var(--grid-gap) 0 var(--grid-gap);
            display: flex; justify-content: space-between; align-items: center;
        }

        .app-header__logo-zone, .app-header__links-zone { pointer-events: auto; display: flex; align-items: center; height: var(--nav-h); }
        .app-header__link {
            color: var(--text-inv) !important; text-decoration: none;
            font-weight: var(--nav-weight); white-space: nowrap;
            display: flex; align-items: center; cursor: pointer;
        }

        /* PC 端链接容器 */
        .app-header__pc-links { display: none; }

        /* 下拉菜单 (Dropdown) */
        .app-header__dropdown { 
            position: absolute; top: 100%; left: 0; display: none; 
            flex-direction: column; width: max-content; 
        }
        .app-header__item--has-sub:hover .app-header__dropdown { display: flex; }

        /* 移动端菜单按钮 */
        .app-header__menu-btn {
            background: none; border: none; cursor: pointer;
            width: 24px; height: var(--nav-h); position: relative;
            display: flex; align-items: center; justify-content: flex-end;
        }
        .app-header__menu-btn span {
            display: block; width: 24px; height: 1.5px; background: #fff;
            position: absolute; transition: all 0.4s var(--ease-in-out);
        }
        .app-header__menu-btn--line1 { transform: translateY(-4px); }
        .app-header__menu-btn--line2 { transform: translateY(4px); }
        .app-header__menu-btn.is-active .app-header__menu-btn--line1 { transform: translateY(0) rotate(45deg); }
        .app-header__menu-btn.is-active .app-header__menu-btn--line2 { transform: translateY(0) rotate(-45deg); }

        /* PC 端样式适配 */
        @media (min-width: 768px) {
            .app-header__pc-links { display: flex; gap: 30px; height: 100%; }
            .app-header__menu-btn { display: none !important; }
            .app-header__item--has-sub { position: relative; height: 100%; display: flex; align-items: center; }
            
            /* 悬浮背景遮罩效果 */
            .app-header__link:hover::before {
                content: ''; position: fixed; left: 0; right: 0; height: 1.2em;
                background: #fff; z-index: -1; pointer-events: none;
                top: calc(var(--grid-gap) + (var(--nav-h)/2) + env(safe-area-inset-top));
                transform: translateY(-50%);
            }
            .app-header__dropdown .app-header__link:hover::before { top: auto; transform: translateY(-5%); }
            .app-header__link:hover { color: #000 !important; }
        }

        /* =============================================================
           [3. MOBILE-OVERLAY] - 移动端全屏菜单
           ============================================================= */
        .mobile-overlay {
            position: fixed; inset: 0; z-index: 9000;
            visibility: hidden; opacity: 0; transition: 0.4s var(--ease-in-out);
        }
        .mobile-overlay.is-active { visibility: visible; opacity: 1; }

        .mobile-overlay__bg {
            position: absolute; top: -15vh; left: 0; width: 100vw; height: 130vh;
            background: rgba(255, 255, 255, 0.4); 
            backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
        }
        .mobile-overlay__content {
            position: absolute; inset: 0; mix-blend-mode: difference;
            padding: calc(80px + env(safe-area-inset-top)) var(--grid-gap) calc(40px + env(safe-area-inset-bottom));
            overflow-y: auto; -webkit-overflow-scrolling: touch;
        }

        .mobile-overlay__group { border-bottom: 0.5px solid rgba(255,255,255,0.2); margin-bottom: 15px; padding-bottom: 12px; }
        .mobile-overlay__main-link { display: flex; justify-content: space-between; align-items: center; font-size: 20px; font-weight: 700; color: #fff; text-decoration: none; }
        .mobile-overlay__sub-links { display: none; flex-direction: column; padding-top: 10px; }
        .mobile-overlay__sub-links.is-open { display: flex; }
        .mobile-overlay__sub-links a { margin: 8px 0; font-size: 18px; color: #fff; text-decoration: none; }

        /* =============================================================
           [4. GALLERY-SYSTEM] - 核心布局组件
           ============================================================= */
        .gallery-system {
            width: 100%; display: grid; grid-template-columns: repeat(12, 1fr); gap: var(--grid-gap);
        }
        
        /* 左侧轨道 */
        .gallery-system__left { grid-column: span 12; }
        .gallery-system__track {
            display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
            scrollbar-width: none; -ms-overflow-style: none;
        }
        .gallery-system__track::-webkit-scrollbar { display: none; }
        .gallery-system__slide { min-width: 100%; scroll-snap-align: start; }

        /* 右侧侧边栏 */
        .gallery-system__right { grid-column: span 12; padding-top: 20px; }
        .gallery-system__pipeline { display: flex; flex-direction: column; }

        /* PC 适配 */
        @media (min-width: 768px) {
            .gallery-system { height: 100vh; overflow: hidden; }
            .gallery-system__left { grid-column: span 7; height: 100%; }
            .gallery-system__right { grid-column: span 5; height: 100%; overflow-y: auto; padding-top: 0; }
            
            .gallery-system__track { flex-direction: column; height: 100%; overflow-y: auto; scroll-snap-type: none; gap: var(--grid-gap); }
            .gallery-system__slide { min-width: 100%; }
            
            .gallery-system__pipeline { 
                padding: calc(var(--nav-h) + var(--grid-gap) + 40px + env(safe-area-inset-top)) 0 0 0;
            }
        }

        /* =============================================================
           [5. MEDIA-ENGINE] - 媒体渲染引擎
           ============================================================= */
        .media-engine { position: relative; width: 100%; background: var(--skeleton-bg); overflow: hidden; line-height: 0; }
        .media-engine__item { width: 100%; height: auto; display: block; opacity: 0; transition: opacity 0.6s var(--ease-in-out); }
        .media-engine__item.is-loaded { opacity: 1; }
        .media-engine__shield { position: absolute; inset: 0; z-index: 5; background: transparent; }

        /* 统一长宽比适配 */
        .media-engine--gallery img { aspect-ratio: 4/5; object-fit: cover; }
        @media (min-width: 768px) { .media-engine--gallery img { aspect-ratio: auto; min-height: 100%; } }

        /* =============================================================
           [6. UI-BLOCKS] - 基础 UI 块
           ============================================================= */
        .ui-text-block { margin: 0 var(--grid-gap) 20px var(--grid-gap); line-height: 1.8; }
        .ui-media-block { margin-bottom: var(--grid-gap); width: 100%; }
    </style>
</head>
<body oncontextmenu="return false;" ondragstart="return false;">

    <!-- HEADER COMPONENT -->
    <header class="app-header" id="appHeader">
        <nav class="app-header__nav">
            <div class="app-header__logo-zone" id="logoZone"></div>
            <div class="app-header__links-zone">
                <div class="app-header__pc-links" id="pcNavLinks"></div>
                <button class="app-header__menu-btn" id="menuToggle">
                    <span class="app-header__menu-btn--line1"></span>
                    <span class="app-header__menu-btn--line2"></span>
                </button>
            </div>
        </nav>
    </header>

    <!-- MOBILE OVERLAY COMPONENT -->
    <div class="mobile-overlay" id="mobileOverlay">
        <div class="mobile-overlay__bg" id="overlayBg"></div>
        <div class="mobile-overlay__content" id="overlayContent"></div>
    </div>

    <!-- MAIN GALLERY COMPONENT -->
    <main class="gallery-system">
        <section class="gallery-system__left">
            <div class="gallery-system__track" id="leftTrack"></div>
        </section>
        <aside class="gallery-system__right">
            <div class="gallery-system__pipeline" id="rightPipeline"></div>
        </aside>
    </main>

    <script>
        /* =============================================================
           [GLOBAL_CONFIG] - 内容与逻辑完全分离
           ============================================================= */
        const GLOBAL_CONFIG = {
            site: {
                title: "ApparEdit™ - NeuePoor",
                favicon: "https://cdn.neuepoor.com/apparedit/template/favicon.webp",
                placeholder: "https://via.placeholder.com/800x1000?text=Loading..."
            },
            navigation: {
                logo: { text: "PoorLegalGuy®", url: "https://home.neuepoor.com/", size: "18px" },
                items: [
                    { 
                        name: "Category", 
                        url: "#", 
                        children: [
                            { name: "Apparedit", url: "https://apparedit.neuepoor.com/" },
                            { name: "Inspo", url: "#" },
                            { name: "Tone", url: "#" },
                            { name: "Raw", url: "#" },
                            { name: "Lab", url: "#" }
                        ]
                    },
                    { 
                        name: "ApparEdit", 
                        url: "#", 
                        children: [
                            { name: "Archive", url: "#" }
                        ]
                    }
                ]
            },
            content: {
                leftGallery: [
                    { url: 'https://cdn.neuepoor.com/apparedit/template/001.webp' },
                    { url: 'https://cdn.neuepoor.com/apparedit/template/002.webp' },
                    { url: 'https://cdn.neuepoor.com/apparedit/template/003.jpg' }
                ],
                rightPipeline: [
                    { 
                        type: 'text', 
                        title: "2603001™", 
                        titleSize: "18px",
                        descSize: "10px",
                        body: "已升级至 v3.70 系统架构。通过 GLOBAL_CONFIG 对象实现了内容驱动。所有组件遵循 BEM 命名规范，核心渲染逻辑已通过 MediaEngine 统一封装，确保了极致的扩展性与维护性。"
                    },
                    { type: 'media', url: 'https://cdn.neuepoor.com/apparedit/template/004.jpg' },
                    { type: 'media', url: 'https://cdn.neuepoor.com/apparedit/template/005.jpg' },
                    { type: 'media', url: 'https://cdn.neuepoor.com/apparedit/template/006.jpg' }
                ]
            }
        };

        /* =============================================================
           [CORE ENGINE] - 核心组件逻辑
           ============================================================ */
        
        /**
         * MediaEngine: 统一处理资产渲染
         * @param {string} url - 资源地址
         * @param {string} className - 容器附加类名
         */
        const MediaEngine = {
            render: (url, className = '') => {
                const isVideo = /\.(mp4|webm|mov)$/i.test(url);
                const html = isVideo 
                    ? `<video class="media-engine__item" src="${url}" muted loop playsinline autoplay preload="metadata"></video>`
                    : `<img class="media-engine__item" src="${url}" loading="lazy" decoding="async">`;
                
                return `
                    <div class="media-engine ${className}">
                        <div class="media-engine__shield"></div>
                        ${html}
                    </div>
                `;
            },
            init: () => {
                // 监听所有媒体加载状态
                document.body.addEventListener('load', (e) => {
                    if (e.target.classList.contains('media-engine__item')) {
                        e.target.classList.add('is-loaded');
                    }
                }, true);
            }
        };

        /**
         * AppHeader: 导航与移动端菜单逻辑
         */
        const AppHeader = {
            init: () => {
                const btn = document.getElementById('menuToggle');
                const overlay = document.getElementById('mobileOverlay');
                const bg = document.getElementById('overlayBg');

                const toggle = () => {
                    const isOpen = btn.classList.toggle('is-active');
                    overlay.classList.toggle('is-active', isOpen);
                    
                    // 针对 iOS 的滚动锁定逻辑
                    if (isOpen) {
                        const scrollY = window.scrollY;
                        document.body.style.top = `-${scrollY}px`;
                        document.body.classList.add('is-locked');
                    } else {
                        const scrollY = parseInt(document.body.style.top || '0') * -1;
                        document.body.classList.remove('is-locked');
                        document.body.style.top = '';
                        window.scrollTo(0, scrollY);
                    }
                };

                btn.addEventListener('click', toggle);
                bg.addEventListener('click', toggle);
            }
        };

        /**
         * UI 渲染主函数
         */
        function renderUI() {
            // 1. Meta 填充
            document.title = GLOBAL_CONFIG.site.title;
            const fav = document.getElementById('ui-favicon');
            if(fav) fav.href = GLOBAL_CONFIG.site.favicon;

            // 2. Logo 渲染
            document.getElementById('logoZone').innerHTML = `
                <a href="${GLOBAL_CONFIG.navigation.logo.url}" class="app-header__link" style="font-size: ${GLOBAL_CONFIG.navigation.logo.size}">
                    ${GLOBAL_CONFIG.navigation.logo.text}
                </a>
            `;

            // 3. PC 导航渲染
            const pcNav = document.getElementById('pcNavLinks');
            pcNav.innerHTML = GLOBAL_CONFIG.navigation.items.map(item => `
                <div class="app-header__item ${item.children ? 'app-header__item--has-sub' : ''}">
                    <a href="${item.url}" class="app-header__link">${item.name}</a>
                    ${item.children ? `
                        <div class="app-header__dropdown">
                            ${item.children.map(child => `<a href="${child.url}" class="app-header__link">${child.name}</a>`).join('')}
                        </div>
                    ` : ''}
                </div>
            `).join('');

            // 4. Mobile 菜单渲染
            const mobileContent = document.getElementById('overlayContent');
            mobileContent.innerHTML = GLOBAL_CONFIG.navigation.items.map((item, idx) => `
                <div class="mobile-overlay__group">
                    <a href="${item.children ? 'javascript:void(0)' : item.url}" class="mobile-overlay__main-link" data-idx="${idx}">
                        ${item.name} ${item.children ? '<span>+</span>' : ''}
                    </a>
                    ${item.children ? `
                        <div class="mobile-overlay__sub-links" id="sub-${idx}">
                            ${item.children.map(child => `<a href="${child.url}">${child.name}</a>`).join('')}
                        </div>
                    ` : ''}
                </div>
            `).join('');

            // 移动端子菜单折叠监听
            mobileContent.addEventListener('click', (e) => {
                const link = e.target.closest('.mobile-overlay__main-link');
                if (link && link.dataset.idx) {
                    const sub = document.getElementById(`sub-${link.dataset.idx}`);
                    if (sub) sub.classList.toggle('is-open');
                }
            });

            // 5. 左侧 Gallery 渲染
            const leftTrack = document.getElementById('leftTrack');
            leftTrack.innerHTML = GLOBAL_CONFIG.content.leftGallery.map(item => `
                <div class="gallery-system__slide">
                    ${MediaEngine.render(item.url, 'media-engine--gallery')}
                </div>
            `).join('');

            // 6. 右侧 Pipeline 渲染
            const rightRoot = document.getElementById('rightPipeline');
            rightRoot.innerHTML = GLOBAL_CONFIG.content.rightPipeline.map(item => {
                if (item.type === 'text') {
                    return `
                        <div class="ui-text-block">
                            <h1 style="font-size: ${item.titleSize}">${item.title}</h1>
                            <p style="font-size: ${item.descSize}">${item.body}</p>
                        </div>
                    `;
                } else if (item.type === 'media') {
                    return `<div class="ui-media-block">${MediaEngine.render(item.url)}</div>`;
                }
                return '';
            }).join('');
        }

        // 初始化
        window.addEventListener('DOMContentLoaded', () => {
            renderUI();
            MediaEngine.init();
            AppHeader.init();
        });
    </script>
</body>
</html>
