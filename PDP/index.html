<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ApparEdit™ - PoorLegalGuy®</title>
    <link rel="icon" type="image/webp" href="https://cdn.neuepoor.com/Favicon.webp">

    <style>
        :root {
            --bg-panel: #fff; 
            --text: #000;
            --nav-h: 44px; 
            --grid-gap: 4px; 
            --f-fallback: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --nav-diff-color: #ffffff; 
            --fs-nav-logo: 18px;
            --fs-nav-links: 12px;
            --overlay-bg: rgba(255, 255, 255, 0.8);
            --safe: 15px;
            --left-ratio: 1.6fr;
            --right-ratio: 1fr;
        }

        @media (prefers-color-scheme: dark) {
            :root { 
                --bg-panel: #000;
                --text: #fff; 
                --overlay-bg: rgba(0, 0, 0, 0.8);
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: var(--f-fallback); 
            color: var(--text);
            overflow-x: hidden; 
            -webkit-font-smoothing: antialiased;
            padding: var(--grid-gap); 
        }

        /* --- Navbar Base --- */
        .nav {
            position: fixed; 
            top: var(--grid-gap); 
            left: var(--grid-gap);
            right: var(--grid-gap);
            height: var(--nav-h);
            z-index: 2000;
            background: transparent; 
            mix-blend-mode: difference; /* 全局差值模式 */
            pointer-events: none;
        }

        /* --- PC Navbar: 12栏对齐系统 --- */
        @media (min-width: 768px) {
            .nav {
                display: grid;
                grid-template-columns: repeat(12, 1fr);
                gap: var(--grid-gap);
            }

            .nav-logo-zone {
                grid-column: 1; 
                display: flex;
                align-items: center;
                padding-left: var(--safe);
                pointer-events: auto;
            }

            .nav-links-zone {
                grid-column: 2 / span 11; 
                display: flex;
                align-items: center;
                justify-content: flex-end; 
                padding-right: var(--safe);
                pointer-events: auto;
            }

            .nav-links-pc {
                display: flex;
                gap: 30px;
            }
            
            .menu-btn { display: none; }
        }

        /* --- Mobile Navbar Layout --- */
        @media (max-width: 767px) {
            .nav {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 0 var(--safe);
            }
            .nav-logo-zone, .nav-links-zone { pointer-events: auto; }
            .nav-links-pc { display: none; }
        }

        /* --- Common Nav Links Style --- */
        .nav a {
            position: relative;
            color: var(--nav-diff-color) !important;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            font-weight: 600;
            z-index: 1;
            transition: color 0.15s ease;
        }

        /* PC Hover 修复：白色实底矩形背景 & 文字反色处理 */
        @media (min-width: 768px) {
            .nav a::before {
                content: '';
                position: absolute;
                /* 略微扩大背景范围以包裹文字 */
                left: -6px; 
                right: -6px;
                height: 1.2em;
                background: white;
                opacity: 0;
                z-index: -1;
                transition: opacity 0.15s ease;
            }

            /* 悬浮时：
               1. 背景块显示 (由于差值模式，它在黑色背景上显白，白色背景上显黑)
               2. 文字通过 color 的改变在差值计算中获得清晰的对比色
            */
            .nav a:hover::before { 
                opacity: 1; 
            }
            
            /* 在差值模式下，背景白+文字黑 = 清晰的可见效果 */
            .nav a:hover {
                color: #000 !important; 
            }
        }

        .logo { font-size: var(--fs-nav-logo); letter-spacing: -0.5px; font-weight: 700; }
        .nav-links-pc a { font-size: var(--fs-nav-links); }

        /* --- Main Content --- */
        .main { display: flex; flex-direction: column; width: 100%; gap: var(--grid-gap); }
        @media (min-width: 768px) {
            .main { 
                display: grid;
                grid-template-columns: var(--left-ratio) var(--right-ratio);
                height: calc(100vh - (var(--grid-gap) * 2)); 
                overflow: hidden; 
                gap: var(--grid-gap); 
            }
        }

        /* --- Panels --- */
        .left-panel, .right-panel { background: var(--bg-panel); position: relative; }
        .left-panel { width: 100%; overflow: hidden; }
        .gallery-track {
            display: flex; width: 100%; overflow-x: auto; 
            scroll-snap-type: x mandatory; scrollbar-width: none; padding: var(--grid-gap);
        }
        .gallery-track::-webkit-scrollbar { display: none; }
        .gallery-item { min-width: 100%; scroll-snap-align: start; }
        .gallery-item img { width: 100%; display: block; object-fit: cover; aspect-ratio: 4 / 5; }

        @media (min-width: 768px) {
            .left-panel { height: 100%; }
            .gallery-track { flex-direction: column; height: 100%; overflow-y: auto; scroll-snap-type: none; gap: var(--grid-gap); }
            .gallery-item img { height: auto; min-height: calc(100vh - 40px); aspect-ratio: auto; }
        }

        /* --- Indicators (Mobile Only) --- */
        .indicators {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 8px; z-index: 10;
        }
        @media (min-width: 768px) { .indicators { display: none; } }
        .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.3); }
        .dot.active { background: #fff; transform: scale(1.2); }

        /* --- Right Panel Content --- */
        .right-panel { width: 100%; overflow-y: auto; }
        .right-inner { padding: calc(var(--nav-h) + var(--grid-gap)) var(--grid-gap) var(--grid-gap) var(--grid-gap); }
        .rich-text { font-size: 11px; line-height: 1.8; }
        .rich-text h1 { font-size: 20px; margin-bottom: 20px; font-weight: 700; }
        .rich-text p { margin-bottom: 15px; opacity: 0.9; }
        .media-box { width: 100%; margin-bottom: var(--grid-gap); }
        .media-box img { width: 100%; height: auto; display: block; }

        /* --- Mobile Menu Button: Morphing Icon --- */
        .menu-btn { 
            background: none; border: none; cursor: pointer; padding: 5px; 
            position: relative; width: 30px; height: 30px; z-index: 2100;
        }
        .menu-btn span { 
            display: block; width: 20px; height: 1.5px; background: var(--nav-diff-color); 
            position: absolute; left: 5px; 
            transition: all 0.4s cubic-bezier(0.32, 1, 0.23, 1);
        }
        .line-1 { top: 11px; }
        .line-2 { top: 19px; }
        .menu-btn.active .line-1 { transform: translateY(4px) rotate(45deg); }
        .menu-btn.active .line-2 { transform: translateY(-4px) rotate(-45deg); }

        /* --- Mobile Overlay: Elastic Feel & Staggered Links --- */
        .overlay {
            position: fixed; inset: 0; 
            background: var(--overlay-bg); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            z-index: 1500; display: flex; flex-direction: column; justify-content: flex-start; align-items: flex-start;
            padding-top: calc(var(--nav-h) + 30px); 
            padding-left: calc(var(--safe) + var(--grid-gap));
            transform: translateY(-100%); 
            transition: transform 0.6s cubic-bezier(0.32, 1, 0.23, 1);
            visibility: hidden;
        }
        .overlay.active { transform: translateY(0); visibility: visible; }
        
        .overlay a { 
            font-size: var(--fs-nav-links); margin: 12px 0; font-weight: 600; 
            color: var(--text) !important; text-decoration: none; 
            opacity: 0; 
            transform: translateY(20px); 
            transition: opacity 0.4s ease, transform 0.5s cubic-bezier(0.32, 1, 0.23, 1);
        }
        .overlay.active a { opacity: 1; transform: translateY(0); }
        .overlay a:nth-child(1) { transition-delay: 0.15s; }
        .overlay a:nth-child(2) { transition-delay: 0.25s; }
        .overlay a:nth-child(3) { transition-delay: 0.35s; }
    </style>
</head>
<body>

    <nav class="nav">
        <!-- PC: 第 1 栏 -->
        <div class="nav-logo-zone">
            <a href="https://home.neuepoor.com/" class="logo">PoorLegalGuy®</a>
        </div>
        <!-- PC: 从第 12 栏往右侧排列 -->
        <div class="nav-links-zone">
            <div class="nav-links-pc">
                <a href="https://home.neuepoor.com">Category</a>
                <a href="https://apparedit.neuepoor.com/">ApparEdit</a>
                <a href="https://apparedit.neuepoor.com/PDP">PDP</a>
            </div>
            <!-- 仅移动端 -->
            <button class="menu-btn" id="menuBtn" onclick="toggleMenu()">
                <span class="line-1"></span>
                <span class="line-2"></span>
            </button>
        </div>
    </nav>

    <!-- 手机端 Staggered 菜单 -->
    <div class="overlay" id="mobileMenu">
        <a href="https://home.neuepoor.com" onclick="toggleMenu()">Category</a>
        <a href="https://apparedit.neuepoor.com/" onclick="toggleMenu()">ApparEdit</a>
        <a href="https://apparedit.neuepoor.com/PDP" onclick="toggleMenu()">PDP</a>
    </div>

    <main class="main">
        <section class="left-panel">
            <div class="gallery-track" id="ui-left-track"></div>
            <div class="indicators" id="ui-dots"></div>
        </section>

        <aside class="right-panel">
            <div class="right-inner" id="ui-right-root"></div>
        </aside>
    </main>

    <script>
        const TARGET_IMG = "https://cdn.neuepoor.com/apparedit/bg1%20%282%29.webp";

        const APP_DATA = {
            leftGallery: Array(5).fill(TARGET_IMG), 
            rightTitle: "ApparEdit™",
            rightBlocks: [
                { t: "p", v: "测试一下的选项，if this support poorlegalguy." },
                { t: "img", v: TARGET_IMG },
                { t: "p", v: "这不仅仅是一个编辑器，它代表了我们对内容创作边界的重新思考。" },
                { t: "img", v: TARGET_IMG }
            ]
        };

        function toggleMenu() {
            if (window.innerWidth >= 768) return;
            const menu = document.getElementById('mobileMenu');
            const btn = document.getElementById('menuBtn');
            const isActive = menu.classList.toggle('active');
            btn.classList.toggle('active');
            document.body.style.overflow = isActive ? 'hidden' : '';
        }

        function init() {
            const track = document.getElementById('ui-left-track');
            const dotsContainer = document.getElementById('ui-dots');

            track.innerHTML = APP_DATA.leftGallery.map(src => `
                <div class="gallery-item"><img src="${src}"></div>
            `).join('');

            dotsContainer.innerHTML = APP_DATA.leftGallery.map((_, i) => `
                <div class="dot ${i === 0 ? 'active' : ''}"></div>
            `).join('');

            track.addEventListener('scroll', () => {
                const index = Math.round(track.scrollLeft / track.offsetWidth);
                const dots = dotsContainer.querySelectorAll('.dot');
                dots.forEach((dot, i) => {
                    dot.classList.toggle('active', i === index);
                });
            });

            document.getElementById('ui-right-root').innerHTML = `
                <div class="rich-text">
                    <h1>${APP_DATA.rightTitle}</h1>
                    ${APP_DATA.rightBlocks.map(b => 
                        b.t === 'p' ? `<p>${b.v}</p>` : `</div><div class="media-box"><img src="${b.v}"></div><div class="rich-text">`
                    ).join('')}
                </div>
            `;
        }

        window.onload = init;
        window.onresize = () => {
            if (window.innerWidth >= 768) {
                document.getElementById('mobileMenu').classList.remove('active');
                document.getElementById('menuBtn').classList.remove('active');
                document.body.style.overflow = '';
            }
        };
    </script>
</body>
</html>
