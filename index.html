<!--
  v1.4.3 VERSION LOG:
  1. 修复 Canvas 预览环境下的路径解析错误（Failed to parse URL）。
  2. 优化 fetch 路径逻辑：在预览环境使用完整 URL，在部署环境使用相对路径。
  3. 增加对 data.json 响应内容的严格检查。
  4. 保持 v1.4.2 的 12 列响应式网格及 4px 间距。
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ApparEdit - Landing Page</title>
    <link id="dynamic-favicon" rel="icon" type="image/webp" href="https://cdn.neuepoor.com/Favicon.webp">
    <style>
        /* [Foundations] 颜色与字体系统 */
        :root {
            --bg: #fff; --text: #000; --border: #efefef; --muted: #999;
            --nav-h: 28px; 
            --gap: 4px; 
            --pad: 10px;
            --f-main: "Arial", -apple-system, sans-serif;
            --sz-logo: 21px; --sz-nav: 12px; --sz-item: 10px;
            --transition: 0.3s ease;
        }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #000; --text: #fff; --border: #111; --muted: #666; }
        }

        /* 全局重置 */
        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; margin: 0; padding: 0; }
        body { 
            font-family: var(--f-main); 
            background: var(--bg); 
            color: var(--text); 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow-x: hidden;
        }

        /* [C01] 导航容器 Navbar - 差值模式 */
        nav { 
            position: fixed; top: 0; width: 100%; height: var(--nav-h); 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 0 var(--pad); z-index: 1001; 
            mix-blend-mode: difference;
            color: #fff; 
            background: transparent; 
            pointer-events: none; 
        }
        
        .brand, .nav-links, #menu-toggle { 
            pointer-events: auto; 
            color: #fff; 
        }
        
        .brand { 
            font-weight: 600; font-size: var(--sz-logo); letter-spacing: -0.02em; 
            text-decoration: none; white-space: nowrap; z-index: 1002; 
        }
        .nav-links { display: none; gap: 12px; font-size: var(--sz-nav); font-weight: 600; }
        @media (min-width: 768px) { .nav-links { display: flex; } }
        .nav-links a { text-decoration: none; color: inherit; transition: var(--transition); }
        .nav-links a:hover { opacity: 0.5; }

        /* [C05] 移动端触发器 Toggle */
        #menu-toggle { 
            display: flex; flex-direction: column; justify-content: center; gap: 5px; 
            background: none; border: none; cursor: pointer; color: inherit; 
            z-index: 1002; width: 25px; height: 100%; 
        }
        #menu-toggle span { width: 18px; height: 1px; background: currentColor; transition: var(--transition); transform-origin: center; }
        @media (min-width: 768px) { #menu-toggle { display: none; } }

        /* [C05] 全屏菜单 Overlay Menu */
        #m-menu { 
            position: fixed; inset: 0; background: var(--bg); z-index: 1000; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            gap: 30px; visibility: hidden; opacity: 0; transition: var(--transition); 
            mix-blend-mode: normal; 
        }
        #m-menu.active { visibility: visible; opacity: 1; }
        #m-menu a { font-size: 16px; text-decoration: none; color: var(--text); font-weight: 600; }

        /* [C02] 归档网格 Archive Grid (12列/6列 响应式系统) */
        main { padding: 40px var(--gap) 0; flex: 1; }
        
        .grid { 
            display: grid; 
            grid-template-columns: repeat(6, 1fr); 
            gap: var(--gap); 
        }
        
        @media (min-width: 768px) { 
            .grid { 
                grid-template-columns: repeat(12, 1fr); 
            } 
        }
        
        /* [C03] 媒体卡片 Media Card */
        .card { 
            text-decoration: none; 
            color: inherit; 
            grid-column: span 6; 
        }
        
        .img-box { aspect-ratio: 3/4; background: var(--border); overflow: hidden; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.6s ease; }
        .card:hover img { transform: scale(1.05); }
        .card-title { padding: 8px 0 16px; font-size: var(--sz-item); opacity: 0.9; }

        /* Footer */
        footer { 
            padding: 30px var(--pad); border-top: 1px solid var(--border); 
            display: flex; flex-direction: column; gap: 15px; font-size: 11px; 
        }
        @media (min-width: 768px) { footer { flex-direction: row-reverse; justify-content: space-between; padding: 40px var(--pad); } }
        
        .copy { color: var(--muted); }
        .copy a { text-decoration: none; color: inherit; }
        
        /* 隐藏滚动条 */
        ::-webkit-scrollbar { display: none; }

        /* 加载状态提示 */
        #loading { grid-column: 1 / -1; padding: 100px 0; text-align: center; font-size: 10px; opacity: 0.5; }
    </style>
</head>
<body>
    <nav id="nav">
        <a id="logo" href="#" class="brand">PoorLegalGuy®</a>
        <div id="d-links" class="nav-links"></div>
        <button id="menu-toggle"><span></span><span></span></button>
    </nav>

    <div id="m-menu"></div>

    <main>
        <div id="grid" class="grid">
            <div id="loading">正在加载存档...</div>
        </div>
    </main>

    <footer>
        <div class="copy">&copy; <span id="year"></span> <a id="f-logo" href="#">PoorLegalGuy® Archive</a></div>
    </footer>

    <script>
        const APP_CONFIG = {
            version: "1.4.3",
            landingLimit: 36, 
            dataPath: "data.json", 
            curUrl: "https://apparedit.neuepoor.com/",
            brand: {
                name: "PoorLegalGuy®",
                home: "https://home.neuepoor.com/",
                archive: "PoorLegalGuy® Archive"
            },
            links: [
                { name: "Category", url: "https://home.neuepoor.com" },
                { name: "ApparEdit", url: "https://apparedit.neuepoor.com/" }
            ]
        };

        const $ = id => document.getElementById(id);

        const toggleMenu = (forceState) => {
            const isOpen = forceState !== undefined ? forceState : !document.body.classList.contains('menu-open');
            document.body.classList.toggle('menu-open', isOpen);
            $('m-menu').classList.toggle('active', isOpen);
            $('nav').style.mixBlendMode = isOpen ? 'normal' : 'difference';
            
            const spans = $('menu-toggle').querySelectorAll('span');
            spans[0].style.transform = isOpen ? "rotate(45deg) translateY(4px)" : "";
            spans[spans.length - 1].style.transform = isOpen ? "rotate(-45deg) translateY(-4px)" : "";
            document.body.style.overflow = isOpen ? 'hidden' : '';
        };

        const createCard = (item, index) => {
            const targetUrl = `${item.id}/index.html`;
            return `
                <a href="${targetUrl}" class="card">
                    <div class="img-box">
                        <img src="${item.img}" loading="lazy" alt="${item.id}" onerror="this.src='https://via.placeholder.com/600x800?text=图片加载失败'">
                    </div>
                    <div class="card-title">${item.id}_${String(index + 1).padStart(2, '0')} [${item.date}]</div>
                </a>
            `;
        };

        function generateMockData() {
            return Array.from({ length: 36 }, (_, i) => ({
                id: "PDP",
                img: "https://cdn.neuepoor.com/apparedit/image-035296a5-5b03-42bd-91b5-4fb17d40b48c.webp",
                date: "2023"
            }));
        }

        async function loadAndRender() {
            try {
                // 判断是否在 Canvas 预览环境 (blob: 协议)
                const isBlob = window.location.protocol === 'blob:';
                // 如果是预览环境且报错，尝试使用绝对路径
                let fetchUrl = isBlob 
                    ? `https://apparedit.neuepoor.com/${APP_CONFIG.dataPath}?t=${Date.now()}` 
                    : `./${APP_CONFIG.dataPath}?t=${Date.now()}`;
                
                const response = await fetch(fetchUrl);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (!Array.isArray(data)) {
                    throw new Error("JSON 数据格式不正确，应为数组。");
                }

                const displayData = data.slice(0, APP_CONFIG.landingLimit);
                
                if (displayData.length > 0) {
                    $('grid').innerHTML = displayData.map((item, idx) => createCard(item, idx)).join('');
                } else {
                    $('grid').innerHTML = '<div id="loading">未找到任何项目。</div>';
                }
            } catch (error) {
                console.warn("加载真实数据失败，回退到预览模式:", error.message);
                const mockData = generateMockData();
                $('grid').innerHTML = mockData.map((item, idx) => createCard(item, idx)).join('');
            }
        }

        function init() {
            $('year').innerText = new Date().getFullYear();
            $('logo').innerText = APP_CONFIG.brand.name;
            $('logo').href = APP_CONFIG.brand.home;
            $('f-logo').innerText = APP_CONFIG.brand.archive;
            $('f-logo').href = APP_CONFIG.brand.home;

            const desktopNav = $('d-links');
            const mobileNav = $('m-menu');
            APP_CONFIG.links.forEach(link => {
                const a = document.createElement('a');
                a.href = link.url;
                a.innerText = link.name;
                if(link.url === APP_CONFIG.curUrl) a.style.opacity = "0.3";
                desktopNav.appendChild(a.cloneNode(true));
                const ma = a.cloneNode(true);
                ma.onclick = () => toggleMenu(false);
                mobileNav.appendChild(ma);
            });

            $('menu-toggle').onclick = () => toggleMenu();
            loadAndRender();
        }

        window.onload = init;
    </script>
</body>
</html>
